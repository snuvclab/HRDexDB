<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRDexDB Object Gallery</title>
  <link rel="icon" type="image/png" href="static/image/hrdexdb_logo_square.png">
  <link rel="apple-touch-icon" href="static/image/hrdexdb_logo_square.png">
  <link rel="preconnect" href="https://huggingface.co" crossorigin>
  <link rel="preconnect" href="https://cdn-lfs.huggingface.co" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #faf8f5;
      --surface: #ffffff;
      --surface-2: #f1ece5;
      --line: #ece7e0;
      --line-strong: #d9d0c5;
      --text: #2b2722;
      --text-muted: #8a8178;
      --accent: #e2603b;
      --accent-hover: #c94f30;
      --accent-soft: #fdeee9;
      --radius: 8px;
      --shadow-soft: 0 1px 2px rgba(40, 30, 20, .04);
      --shadow-lift: 0 14px 30px rgba(40, 30, 20, .10);
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); }
    button { font: inherit; cursor: pointer; }

    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      min-height: 53px;
      align-items: center;
      gap: 24px;
      padding: 12px 24px;
      background: rgba(255, 255, 255, .94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .nav-logo { display: inline-flex; align-items: center; flex: 0 0 auto; }
    .nav-logo img {
      display: block;
      width: auto;
      height: 30px;
      max-width: min(42vw, 184px);
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      margin-left: auto;
    }

    .nav-link {
      display: inline-flex;
      min-height: 32px;
      align-items: center;
      padding: 8px 13px;
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
    }

    .nav-link:hover,
    .nav-link.active { color: var(--text); background: var(--surface-2); }

    .nav-link.cta {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 1px 2px rgba(226, 96, 59, .25);
    }

    .nav-link.cta:hover { background: var(--accent-hover); color: #fff; }

    .container {
      max-width: 1500px;
      margin: 0 auto;
      padding: 18px 24px 72px;
    }

    .gallery-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
    }

    .gallery-kicker {
      color: var(--accent-hover);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .gallery-title {
      margin-top: 4px;
      font-size: clamp(2rem, 4vw, 4rem);
      line-height: 1;
    }

    .gallery-summary {
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-hover);
      font-size: .82rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .gallery-shell {
      display: block;
      max-width: 1120px;
      margin: 0 auto;
    }

    .gallery-shell.has-selection {
      display: grid;
      max-width: none;
      grid-template-columns: minmax(500px, 580px) minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .object-panel,
    .viewer-panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-soft);
    }

    .object-panel-header,
    .viewer-header {
      display: flex;
      min-height: 60px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .panel-title {
      font-size: .82rem;
      font-weight: 850;
      letter-spacing: .03em;
      text-transform: uppercase;
    }

    .panel-subtitle,
    .viewer-meta {
      margin-top: 2px;
      color: var(--text-muted);
      font-size: .78rem;
      font-weight: 700;
    }

    .object-count {
      color: var(--text-muted);
      font-size: .78rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .object-search-wrap {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #faf8f5;
    }

    .object-search {
      width: 100%;
      min-height: 38px;
      padding: 8px 11px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      outline: none;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: .82rem;
      transition: border-color .16s, box-shadow .16s;
    }

    .object-search::placeholder { color: var(--text-muted); }

    .object-search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(226, 96, 59, .13);
    }

    .object-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      align-content: start;
      padding: 12px;
    }

    .future-divider {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      grid-column: 1 / -1;
      margin-top: 16px;
      padding: 15px 4px 7px;
      border-top: 1px solid var(--line);
      color: var(--text-muted);
      font-size: .82rem;
      font-weight: 850;
      letter-spacing: .03em;
      text-transform: uppercase;
    }

    .future-divider[hidden] { display: none; }

    .future-divider .object-count {
      letter-spacing: normal;
      text-transform: none;
    }

    .has-selection .object-panel {
      position: sticky;
      top: 66px;
      display: flex;
      height: min(840px, calc(100vh - 84px));
      min-height: 620px;
      flex-direction: column;
    }

    .has-selection .object-grid {
      flex: 1 1 0;
      grid-auto-rows: max-content;
      min-height: 0;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .object-card {
      position: relative;
      display: flex;
      align-self: start;
      min-width: 0;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      text-align: left;
      box-shadow: var(--shadow-soft);
      transition: border-color .16s, box-shadow .16s, transform .16s;
    }

    .object-card:hover,
    .object-card.active {
      border-color: rgba(226, 96, 59, .65);
      box-shadow: var(--shadow-lift);
      transform: translateY(-1px);
    }

    .object-card.active { outline: 2px solid rgba(226, 96, 59, .18); }
    .object-card[hidden] { display: none; }

    .articulated-badge {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      padding: 3px 7px;
      border: 1px solid #b8cec2;
      border-radius: 5px;
      background: #edf6f0;
      color: #37654d;
      font-size: .65rem;
      font-weight: 800;
      line-height: 1.35;
      white-space: nowrap;
    }

    .object-card .articulated-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      max-width: calc(100% - 12px);
      pointer-events: none;
    }

    .viewer-title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .articulated-badge[hidden] { display: none; }

    .search-empty {
      grid-column: 1 / -1;
      padding: 36px 12px;
      color: var(--text-muted);
      font-size: .84rem;
      font-weight: 700;
      text-align: center;
    }

    .search-empty[hidden] { display: none; }

    .object-card img {
      display: block;
      flex: 0 0 auto;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      object-fit: contain;
      background: var(--bg);
    }

    .object-card-label {
      min-width: 0;
      overflow: hidden;
      padding: 9px 10px 10px;
      font-size: .84rem;
      font-weight: 800;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .has-selection .object-grid { gap: 7px; padding: 9px; }
    .has-selection .object-card-label { padding: 6px 7px 7px; font-size: .72rem; }

    .viewer-panel { display: none; min-height: 620px; }
    .has-selection .viewer-panel { display: block; }

    .viewer-title {
      min-width: 0;
      font-size: 1.08rem;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .viewer-actions { display: flex; flex: 0 0 auto; gap: 7px; }

    .viewer-button {
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      justify-content: center;
      padding: 7px 11px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--surface);
      color: var(--text);
      font-size: .78rem;
      font-weight: 800;
    }

    .viewer-button:hover { border-color: var(--accent); color: var(--accent-hover); }

    .viewer-stage {
      position: relative;
      height: min(72vh, 760px);
      min-height: 540px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 40%, rgba(255,255,255,.9), rgba(241,236,229,.82) 58%, rgba(217,208,197,.82)),
        var(--surface-2);
    }

    .viewer-stage canvas { display: block; width: 100%; height: 100%; }

    .viewer-status {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 32px;
      background: rgba(250, 248, 245, .82);
      color: var(--text-muted);
      text-align: center;
      font-size: .9rem;
      font-weight: 800;
      backdrop-filter: blur(3px);
    }

    .viewer-status[hidden] { display: none; }

    .viewer-hint {
      padding: 9px 14px;
      border-top: 1px solid var(--line);
      color: var(--text-muted);
      font-size: .76rem;
      font-weight: 700;
      text-align: right;
    }

    .articulation-control {
      display: grid;
      grid-template-columns: minmax(100px, auto) minmax(140px, 1fr) 44px;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border-top: 1px solid var(--line);
      background: #faf8f5;
    }

    .articulation-controls[hidden] { display: none; }

    .articulation-label {
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .articulation-slider {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .articulation-value {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .load-error { color: #b34035; }
    .load-error strong { display: block; margin-bottom: 5px; color: var(--text); }

    @media (max-width: 1120px) {
      .gallery-shell.has-selection {
        grid-template-columns: minmax(420px, 500px) minmax(0, 1fr);
      }
      .viewer-stage { min-height: 500px; }
    }

    @media (max-width: 900px) {
      .gallery-head { align-items: flex-start; flex-direction: column; }
      .gallery-shell.has-selection { grid-template-columns: 1fr; }
      .has-selection .object-panel {
        position: static;
        height: 440px;
        min-height: 0;
      }
      .viewer-panel { min-height: 0; }
      .viewer-stage { height: 64vh; min-height: 440px; }
    }

    @media (max-width: 640px) {
      .nav { gap: 14px; padding: 12px 16px; }
      .nav-link:not(.cta):not(.active) { display: none; }
      .nav-link { padding: 8px 9px; font-size: 13px; }
      .container { padding: 16px 12px 56px; }
      .object-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .has-selection .object-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .has-selection .object-card-label { font-size: .65rem; }
      .viewer-header { align-items: stretch; flex-direction: column; }
      .viewer-actions { width: 100%; }
      .viewer-button { flex: 1 1 auto; }
      .viewer-stage { min-height: 390px; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a class="nav-logo" href="gallery-index.html" aria-label="HRDexDB home">
      <img src="static/image/hrdexdb_logo.png" alt="HRDexDB">
    </a>
    <div class="nav-links">
      <a class="nav-link" href="gallery-index.html">Overview</a>
      <a class="nav-link" href="https://snuvclab.github.io/HRDexDB/">Project</a>
      <a class="nav-link" href="./static/pdf/hrdexdb.pdf" target="_blank" rel="noreferrer">Paper</a>
      <a class="nav-link" href="https://github.com/snuvclab/HRDexDB" target="_blank" rel="noreferrer">Code</a>
      <a class="nav-link active" href="object-gallery.html">Object Gallery</a>
      <a class="nav-link cta" href="gallery.html">Sequence Gallery</a>
    </div>
  </nav>

  <main class="container">
    <header class="gallery-head">
      <div>
        <div class="gallery-kicker">Dataset Gallery</div>
        <h1 class="gallery-title">Object Gallery</h1>
      </div>
      <div class="gallery-summary" id="gallery-summary">Loading objects…</div>
    </header>

    <section class="gallery-shell" id="gallery-shell">
      <aside class="object-panel" aria-label="Object selector">
        <div class="object-panel-header">
          <div>
            <div class="panel-title">Objects</div>
            <div class="panel-subtitle" id="object-panel-subtitle">Select an object to inspect its 3D model.</div>
          </div>
          <span class="object-count" id="object-count"></span>
        </div>
        <div class="object-search-wrap">
          <input class="object-search" id="object-search" type="search" placeholder="Search objects" aria-label="Search objects" aria-controls="object-grid" autocomplete="off" spellcheck="false">
        </div>
        <div class="object-grid" id="object-grid"></div>
      </aside>

      <section class="viewer-panel" aria-label="Selected object 3D viewer">
        <div class="viewer-header">
          <div>
            <div class="viewer-title-row">
              <h2 class="viewer-title" id="viewer-title">Object</h2>
              <span class="articulated-badge" id="viewer-articulated-badge" title="Use the Articulation slider below the model to move its parts." hidden>Articulated</span>
            </div>
            <div class="viewer-meta" id="viewer-meta"></div>
          </div>
          <div class="viewer-actions">
            <button class="viewer-button" id="show-all" type="button">All objects</button>
            <button class="viewer-button" id="fit-view" type="button">Fit view</button>
          </div>
        </div>
        <div class="viewer-stage" id="viewer-stage">
          <div class="viewer-status" id="viewer-status">Choose an object to load its GLB.</div>
        </div>
        <div class="articulation-controls" id="articulation-controls" hidden></div>
        <div class="viewer-hint">Drag to rotate · scroll to zoom · right-drag to pan · ← → change object</div>
      </section>
    </section>
  </main>

  <script type="module">
    import * as THREE from "three";
    import { TrackballControls } from "three/addons/controls/TrackballControls.js";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    const MANIFEST_URL = "static/object-gallery-manifest.json";
    const POSES_URL = "static/object-gallery-poses.json";
    const THUMB_BASE = "static/gallery-object-thumbs";
    const THUMB_VERSION = "daiso-oct08-saved-double-sided-1";

    const shell = document.getElementById("gallery-shell");
    const grid = document.getElementById("object-grid");
    const count = document.getElementById("object-count");
    const searchInput = document.getElementById("object-search");
    const summary = document.getElementById("gallery-summary");
    const subtitle = document.getElementById("object-panel-subtitle");
    const viewerTitle = document.getElementById("viewer-title");
    const viewerArticulatedBadge = document.getElementById("viewer-articulated-badge");
    const viewerMeta = document.getElementById("viewer-meta");
    const viewerStage = document.getElementById("viewer-stage");
    const viewerStatus = document.getElementById("viewer-status");
    const articulationControls = document.getElementById("articulation-controls");

    let manifest = null;
    let galleryObjects = [];
    let savedPoses = {};
    let selectedIndex = -1;
    let renderer = null;
    let scene = null;
    let camera = null;
    let controls = null;
    let axisLights = [];
    let loader = null;
    let currentRoot = null;
    let currentSphere = null;
    let currentArticulations = [];
    let loadToken = 0;
    let resizeObserver = null;
    let searchEmpty = null;

    init();

    async function init() {
      try {
        const [manifestResponse, posesResponse] = await Promise.all([
          fetch(MANIFEST_URL, { cache: "no-cache" }),
          fetch(POSES_URL, { cache: "no-cache" })
        ]);
        if (!manifestResponse.ok) throw new Error(`Manifest request failed: ${manifestResponse.status}`);
        if (!posesResponse.ok) throw new Error(`Pose request failed: ${posesResponse.status}`);
        manifest = await manifestResponse.json();
        savedPoses = (await posesResponse.json()).poses || {};
        if (!Array.isArray(manifest.objects) || !manifest.objects.length) {
          throw new Error("Object manifest is empty.");
        }
        const extras = manifest.extraObjects || [];
        const notYetObjects = extras.filter(item => item.section !== "tbd");
        const tbdObjects = extras.filter(item => item.section === "tbd");
        galleryObjects = [...manifest.objects, ...notYetObjects, ...tbdObjects];
        if (new Set(galleryObjects.map(item => item.id)).size !== galleryObjects.length) {
          throw new Error("Object manifest contains duplicate IDs.");
        }
        renderObjects();
        count.textContent = `${manifest.objects.length} objects`;
        summary.textContent = `${manifest.objects.length} object models`;

        const requested = new URLSearchParams(location.search).get("object");
        const requestedIndex = galleryObjects.findIndex(item => item.id === requested);
        if (requestedIndex >= 0) selectObject(requestedIndex, false);
      } catch (error) {
        console.error(error);
        summary.textContent = "Objects unavailable";
        grid.innerHTML = '<div class="viewer-status load-error"><strong>Object list failed to load.</strong>Please refresh and try again.</div>';
      }
    }

    function renderObjects() {
      const fragment = document.createDocumentFragment();
      const addCards = (items, startIndex) => items.forEach((item, offset) => {
        const index = startIndex + offset;
        const button = document.createElement("button");
        button.className = "object-card";
        button.type = "button";
        button.dataset.index = String(index);
        const articulated = Boolean(item.articulation || item.articulations?.length);
        button.dataset.search = `${item.id} ${displayName(item.id)} ${articulated ? "articulated" : ""}`.toLocaleLowerCase();
        button.dataset.section = item.section === "tbd" ? "tbd" : index >= manifest.objects.length ? "not-yet" : "current";
        button.setAttribute("aria-label", `View ${displayName(item.id)}${articulated ? " — articulated" : ""}`);

        const image = document.createElement("img");
        image.src = `${THUMB_BASE}/${encodeURIComponent(item.id)}/thumb.png?v=${THUMB_VERSION}`;
        image.alt = displayName(item.id);
        image.loading = index < 16 ? "eager" : "lazy";

        const label = document.createElement("div");
        label.className = "object-card-label";
        label.textContent = displayName(item.id);
        label.title = displayName(item.id);

        button.append(image, label);
        if (articulated) {
          const badge = document.createElement("span");
          badge.className = "articulated-badge";
          badge.textContent = "Articulated";
          button.title = "Move this object's parts with the Articulation slider.";
          button.append(badge);
        }
        button.addEventListener("click", () => selectObject(index, true));
        fragment.append(button);
      });
      addCards(manifest.objects, 0);
      const extras = manifest.extraObjects || [];
      const notYetObjects = extras.filter(item => item.section !== "tbd");
      const tbdObjects = extras.filter(item => item.section === "tbd");
      if (notYetObjects.length) {
        const heading = document.createElement("div");
        heading.className = "future-divider";
        heading.id = "not-yet-divider";
        heading.textContent = "Not Yet in Episodes";
        const sectionCount = document.createElement("span");
        sectionCount.className = "object-count";
        sectionCount.textContent = `${notYetObjects.length.toLocaleString()} objects`;
        heading.append(sectionCount);
        fragment.append(heading);
        addCards(notYetObjects, manifest.objects.length);
      }
      if (tbdObjects.length) {
        const heading = document.createElement("div");
        heading.className = "future-divider";
        heading.id = "tbd-divider";
        heading.textContent = "TBD";
        const sectionCount = document.createElement("span");
        sectionCount.className = "object-count";
        sectionCount.textContent = `${tbdObjects.length.toLocaleString()} objects`;
        heading.append(sectionCount);
        fragment.append(heading);
        addCards(tbdObjects, manifest.objects.length + notYetObjects.length);
      }
      searchEmpty = document.createElement("div");
      searchEmpty.className = "search-empty";
      searchEmpty.textContent = "No matching objects.";
      searchEmpty.hidden = true;
      fragment.append(searchEmpty);
      grid.replaceChildren(fragment);
    }

    function filterObjects() {
      if (!manifest) return;
      const query = searchInput.value.trim().toLocaleLowerCase();
      let visible = 0;
      let notYetVisible = 0;
      let tbdVisible = 0;
      grid.querySelectorAll(".object-card").forEach(card => {
        const matches = !query || card.dataset.search.includes(query);
        card.hidden = !matches;
        if (matches) {
          visible += 1;
          if (card.dataset.section === "not-yet") notYetVisible += 1;
          if (card.dataset.section === "tbd") tbdVisible += 1;
        }
      });
      count.textContent = query ? `${visible} results · ${manifest.objects.length} objects` : `${manifest.objects.length} objects`;
      const notYetDivider = document.getElementById("not-yet-divider");
      if (notYetDivider) notYetDivider.hidden = notYetVisible === 0;
      const tbdDivider = document.getElementById("tbd-divider");
      if (tbdDivider) tbdDivider.hidden = tbdVisible === 0;
      if (searchEmpty) searchEmpty.hidden = visible !== 0;
    }

    function selectObject(index, updateHistory) {
      if (!galleryObjects[index]) return;
      selectedIndex = index;
      const item = galleryObjects[index];

      shell.classList.add("has-selection");
      subtitle.textContent = displayName(item.id);
      viewerTitle.textContent = displayName(item.id);
      viewerArticulatedBadge.hidden = true;
      viewerMeta.textContent = `${(item.articulatedTriangles ?? item.triangles).toLocaleString()} triangles`;
      grid.querySelectorAll(".object-card").forEach((card, cardIndex) => {
        const active = cardIndex === index;
        card.classList.toggle("active", active);
        card.setAttribute("aria-pressed", String(active));
      });

      const activeCard = grid.querySelector(`.object-card[data-index="${index}"]`);
      activeCard?.scrollIntoView({ block: "nearest" });

      if (updateHistory) {
        const url = new URL(location.href);
        url.searchParams.set("object", item.id);
        history.replaceState(null, "", url);
      }

      ensureViewer();
      loadObject(item);
    }

    function ensureViewer() {
      if (renderer) return;

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      viewerStage.prepend(renderer.domElement);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf1ece5);

      camera = new THREE.PerspectiveCamera(38, 1, 0.001, 100);
      controls = new TrackballControls(camera, renderer.domElement);
      controls.staticMoving = true;
      controls.rotateSpeed = 1.2;

      const pmrem = new THREE.PMREMGenerator(renderer);
      const environment = new RoomEnvironment(renderer);
      scene.environment = pmrem.fromScene(environment, 0.04).texture;
      environment.dispose();
      pmrem.dispose();

      const axes = [
        new THREE.Vector3(1, 0, 0), new THREE.Vector3(-1, 0, 0),
        new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, -1, 0),
        new THREE.Vector3(0, 0, 1), new THREE.Vector3(0, 0, -1)
      ];
      axisLights = axes.map(axis => {
        const light = new THREE.DirectionalLight(0xffffff, 0.35);
        scene.add(light, light.target);
        return { axis, light };
      });

      loader = new GLTFLoader();
      resizeObserver = new ResizeObserver(resizeViewer);
      resizeObserver.observe(viewerStage);
      resizeViewer();
      renderer.setAnimationLoop(() => {
        controls.update();
        camera.updateMatrixWorld(true);
        const center = controls.target;
        const lightDistance = Math.max((currentSphere?.radius || 0) * 3, 1);
        for (const { axis, light } of axisLights) {
          light.position.copy(center).addScaledVector(axis.clone().applyQuaternion(camera.quaternion), lightDistance);
          light.target.position.copy(center);
          light.target.updateMatrixWorld(true);
        }
        renderer.render(scene, camera);
      });
    }

    function loadObject(item) {
      const token = ++loadToken;
      const isDaiso = manifest.extraObjects?.some(extra => extra.id === item.id && extra.section !== "tbd");
      for (const { axis, light } of axisLights) {
        light.intensity = isDaiso ? (axis.z === 1 ? 0.85 : 0.50) : 0.35;
      }
      setStatus(`Loading ${displayName(item.id)}…`);
      disposeCurrent();

      const base = String(manifest.glbBase || "").replace(/\/$/, "");
      const articulatedBase = String(manifest.articulatedGlbBase || "").replace(/\/$/, "");
      const articulated = Boolean(item.articulation || item.articulations?.length);
      const modelBase = articulated && articulatedBase ? articulatedBase : base;
      const modelBytes = item.articulatedBytes || item.articulation?.bytes || item.bytes;
      const url = `${modelBase}/${encodeURIComponent(item.id)}.glb?v=${modelBytes}`;
      loader.load(
        url,
        gltf => {
          if (token !== loadToken) {
            disposeTree(gltf.scene);
            return;
          }
          currentRoot = gltf.scene;
          configureMaterials(item);
          scene.add(currentRoot);
          configureArticulation(item);
          fitView(item);
          setStatus("", true);
        },
        event => {
          if (token !== loadToken || !event.total) return;
          const percent = Math.min(100, Math.round(event.loaded / event.total * 100));
          setStatus(`Loading ${displayName(item.id)}… ${percent}%`);
        },
        error => {
          if (token !== loadToken) return;
          console.error(error);
          viewerStatus.hidden = false;
          viewerStatus.innerHTML = '<div class="load-error"><strong>Object GLB is not available yet.</strong>The gallery is ready and will load this model after the object files are uploaded to Hugging Face.</div>';
        }
      );
    }

    function configureMaterials(item) {
      currentRoot.traverse(node => {
        if (!node.isMesh) return;
        const materials = Array.isArray(node.material) ? node.material : [node.material];
        materials.filter(Boolean).forEach(material => {
          material.envMapIntensity = item.environmentIntensity ?? 0.55;
          if (item.doubleSided) {
            material.side = THREE.DoubleSide;
            material.needsUpdate = true;
          }
        });
      });
    }

    function configureArticulation(item) {
      currentArticulations = [];
      articulationControls.replaceChildren();
      articulationControls.hidden = true;
      const definitions = item.articulations || (item.articulation ? [{ ...item.articulation, type: "revolute", legacy: true }] : []);
      for (const [index, definition] of definitions.entries()) {
        const node = currentRoot.getObjectByName(definition.node);
        const axis = new THREE.Vector3(...definition.axis).normalize();
        const range = definition.type === "prismatic" ? definition.rangeM : definition.rangeRad;
        if (!node || axis.lengthSq() === 0 || !Array.isArray(range) || range.length !== 2 || range[0] >= range[1]) {
          console.warn("Invalid articulation metadata", item.id, definition);
          continue;
        }
        const row = document.createElement("label");
        row.className = "articulation-control";
        const caption = document.createElement("span");
        caption.className = "articulation-label";
        caption.textContent = definition.label || "Articulation";
        const slider = document.createElement("input");
        slider.className = "articulation-slider";
        slider.type = "range";
        slider.min = "0";
        slider.max = "100";
        slider.step = "1";
        slider.setAttribute("aria-label", definition.label || `Articulation ${index + 1}`);
        const output = document.createElement("output");
        output.className = "articulation-value";
        row.append(caption, slider, output);
        articulationControls.append(row);
        const joint = {
          node, axis, lower: range[0], upper: range[1],
          type: definition.type, legacy: Boolean(definition.legacy),
          restPosition: node.position.clone(), restQuaternion: node.quaternion.clone(), output
        };
        currentArticulations.push(joint);
        const initialPercent = THREE.MathUtils.clamp(-range[0] / (range[1] - range[0]) * 100, 0, 100);
        slider.value = String(initialPercent);
        slider.addEventListener("input", () => setArticulation(joint, Number(slider.value)));
        setArticulation(joint, initialPercent);
      }
      articulationControls.hidden = currentArticulations.length === 0;
      viewerArticulatedBadge.hidden = currentArticulations.length === 0;
    }

    function setArticulation(joint, percent) {
      const normalized = THREE.MathUtils.clamp(percent / 100, 0, 1);
      const value = THREE.MathUtils.lerp(joint.lower, joint.upper, normalized);
      if (joint.type === "prismatic") {
        joint.node.position.copy(joint.restPosition).addScaledVector(joint.axis, value);
      } else {
        joint.node.quaternion.copy(joint.restQuaternion).multiply(new THREE.Quaternion().setFromAxisAngle(joint.axis, value));
      }
      joint.node.updateMatrixWorld(true);
      const display = joint.legacy ? `${Math.round(percent)}%`
        : joint.type === "prismatic" ? `${Math.round(value * 1000)} mm`
        : `${Math.round(THREE.MathUtils.radToDeg(value))}°`;
      joint.output.value = display;
      joint.output.textContent = display;
    }

    function fitView(item = galleryObjects[selectedIndex], useSavedPose = true) {
      if (!currentRoot) return;
      const bounds = new THREE.Box3().setFromObject(currentRoot);
      currentSphere = bounds.getBoundingSphere(new THREE.Sphere());
      const radius = Math.max(currentSphere.radius, 1e-5);
      const halfFov = THREE.MathUtils.degToRad(camera.fov * .5);
      const distance = radius / Math.sin(halfFov) * 1.18;
      const direction = new THREE.Vector3(1, .68, 1).normalize();

      const pose = useSavedPose && item && savedPoses[item.id]?.camera;
      if (pose) {
        camera.position.fromArray(pose.position);
        camera.up.fromArray(pose.up);
        camera.fov = pose.fov;
        // Legacy review used a square guide inside a taller stage; new review
        // uses an actual square viewport and records its framing scale.
        camera.zoom = pose.zoom * (pose.thumbnailFrameScale ?? (1136 / 1050));
        controls.target.fromArray(pose.target);
      } else {
        camera.position.copy(currentSphere.center).addScaledVector(direction, distance);
        camera.up.set(0, 1, 0);
        camera.fov = 38;
        camera.zoom = 1;
        controls.target.copy(currentSphere.center);
      }
      camera.near = Math.max(distance / 1000, .00001);
      camera.far = Math.max(distance * 100, 10);
      camera.updateProjectionMatrix();

      controls.minDistance = radius * .12;
      controls.maxDistance = radius * 18;
      controls.update();
    }

    function disposeCurrent() {
      if (!currentRoot) return;
      disposeTree(currentRoot);
      scene.remove(currentRoot);
      currentRoot = null;
      currentSphere = null;
      currentArticulations = [];
      articulationControls.replaceChildren();
      articulationControls.hidden = true;
    }

    function disposeTree(root) {
      root.traverse(node => {
        if (!node.isMesh) return;
        node.geometry?.dispose();
        const materials = Array.isArray(node.material) ? node.material : [node.material];
        materials.filter(Boolean).forEach(material => {
          Object.values(material).forEach(value => {
            if (value?.isTexture) value.dispose();
          });
          material.dispose();
        });
      });
    }

    function resizeViewer() {
      if (!renderer) return;
      const width = Math.max(1, viewerStage.clientWidth);
      const height = Math.max(1, viewerStage.clientHeight);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      controls.handleResize();
    }

    function setStatus(message, hidden = false) {
      viewerStatus.textContent = message;
      viewerStatus.hidden = hidden;
    }

    function showAllObjects() {
      shell.classList.remove("has-selection");
      grid.querySelectorAll(".object-card").forEach(card => {
        card.classList.remove("active");
        card.setAttribute("aria-pressed", "false");
      });
      selectedIndex = -1;
      disposeCurrent();
      const url = new URL(location.href);
      url.searchParams.delete("object");
      history.replaceState(null, "", url);
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function displayName(id) {
      return String(id).split("_").map(word => word ? word[0].toUpperCase() + word.slice(1) : "").join(" ");
    }

    document.getElementById("show-all").addEventListener("click", showAllObjects);
    document.getElementById("fit-view").addEventListener("click", () => fitView());
    searchInput.addEventListener("input", filterObjects);
    searchInput.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;
      event.stopPropagation();
      searchInput.value = "";
      filterObjects();
    });

    window.addEventListener("keydown", event => {
      if (!galleryObjects.length || selectedIndex < 0) return;
      if (event.target instanceof HTMLInputElement) return;
      if (event.key === "Escape") {
        showAllObjects();
        return;
      }
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      const direction = event.key === "ArrowRight" ? 1 : -1;
      const next = (selectedIndex + direction + galleryObjects.length) % galleryObjects.length;
      selectObject(next, true);
    });
  </script>
</body>
</html>
