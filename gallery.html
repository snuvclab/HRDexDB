      loading: null,
      THREE: null,
      OrbitControls: null,
      GLTFLoader: null,
      MeshoptDecoder: null,
      renderer: null,
      scene: null,
      camera: null,
      controls: null,
      mixer: null,
      clock: null,
      model: null,
      assetRoot: null,
      duration: 0,
      clipDuration: 0,
      playing: true,
      currentSrc: "",
      currentHand: "",
      loadToken: 0,
      fetchAbortController: null,
      frame: null,
      resizeObserver: null,
      syncEventsBound: false,
      grid: null,
      cameraCalibration: null,
      zoomScale: DEFAULT_VIEW_ZOOM_SCALE,
      autoZoomScale: DEFAULT_VIEW_ZOOM_SCALE,
      objectCenterY: null
    };

    const els = {};
    [
      "summary-pills",
      "hand-filter",
      "outcome-filter",
      "object-selector",
      "pose-selector",
      "object-header",
      "pose-header",
      "object-value",
      "pose-value",
      "selected-title",
      "selected-subtitle",
      "viewer-actions",
      "download-menu",
      "download-trigger",
      "download-popover",
      "download-tab-full",
      "download-tab-without-video",
      "download-command",
      "copy-download-command",
      "download-description",
      "version-menu",
      "version-trigger",
      "version-popover",
      "main-video",
      "video-pending-layer",
      "video-pending-title",
      "video-pending-copy",
      "pending-layer",
      "pending-title",
      "pending-copy",
      "interactive-3d-viewer",
      "interactive-3d-canvas",
      "interactive-3d-status",
      "interactive-3d-play",
      "interactive-3d-scrub",
      "interactive-3d-readout",
      "interactive-3d-speed",
      "camera-view-menu",
      "camera-view-select",
      "object-strip",
      "object-count",
      "pose-strip",
      "pose-count",
    ].forEach(id => { els[id] = document.getElementById(id); });

    Promise.all([
      optionalJson(CATALOG_URL, null),
      optionalJson(EPISODE_THUMBNAILS_URL, { thumbnails: {} }),
      optionalJson(GRASP_RESULT_MANIFEST_URL, { results: {} }),
      optionalJson(INTERACTIVE_3D_VISIBILITY_URL, { interactive3D: {} })
    ]).then(([catalog, thumbnailManifest, resultManifest, visibilityManifest]) => {
      state.episodeThumbnails = thumbnailManifest?.thumbnails || {};
      state.graspResults = resultManifest?.results || {};
      state.interactive3DVisibility = visibilityManifest?.interactive3D || {};
      const fallbackCatalog = catalogFromManifestKeys(
        state.episodeThumbnails,
        state.graspResults,
        state.interactive3DVisibility
      );
      const rawCatalog = hasCatalogData(catalog)
        ? {
          ...catalog,
          // The remote catalog predates Inspire DFTP. Merge its episodes from
          // the local result manifest without altering the other catalog rows.
          inspire_dftp: mergeEmbodimentCatalogs(catalog.inspire_dftp, fallbackCatalog.inspire_dftp)
        }
        : fallbackCatalog;
      state.catalog = datasetCatalogOnly(rawCatalog);
      state.episodes = flattenEpisodes();
      fillFilters();
      renderSummary();
      selectInitialEpisode();
      applyInitialViewParams();
      bindEvents();
      renderAll();
    }).catch(error => {
      console.error(error);
      els["selected-title"].textContent = "Gallery data failed to load";
      els["selected-subtitle"].textContent = error.message || String(error);
      clearMedia();
    });

    async function optionalJson(url, fallback) {
      try {
        const response = await fetch(url, { cache: "no-cache" });
        if (!response.ok) return fallback;
        return response.json();
      } catch (error) {
        console.warn(error);
        return fallback;
      }
    }

    function datasetCatalogOnly(catalog) {
      return Object.fromEntries(Object.entries(catalog || {})
        .filter(([hand]) => DATASET_EMBODIMENTS.has(hand)));
    }

    function mergeEmbodimentCatalogs(...catalogs) {
      const merged = {};
      catalogs.forEach(catalog => {
        Object.entries(catalog || {}).forEach(([objId, sequences]) => {
          const values = Array.isArray(sequences) ? sequences : Object.keys(sequences || {});
          merged[objId] ||= [];
          merged[objId].push(...values.map(String));
        });
      });
      Object.keys(merged).forEach(objId => {
        merged[objId] = [...new Set(merged[objId])].sort(compareEpisodeIds);
      });
      return merged;
    }

    function compareEpisodeIds(a, b) {
      const numA = Number(a);
      const numB = Number(b);
      if (Number.isFinite(numA) && Number.isFinite(numB) && numA !== numB) return numA - numB;
      return String(a).localeCompare(String(b));
    }

    function hasCatalogData(catalog) {
      return Boolean(catalog && typeof catalog === "object" && Object.keys(catalog).length);
    }

    function catalogFromManifestKeys(...sources) {
      const catalog = {};
      sources.forEach(source => {
        Object.keys(source || {}).forEach(key => addCatalogKey(catalog, key));
      });
      Object.values(catalog).forEach(objects => {
        Object.keys(objects).forEach(objId => {
          objects[objId] = [...new Set(objects[objId])].sort(compareEpisodeIds);
        });
      });
      return catalog;
    }

    function addCatalogKey(catalog, key) {
      const parts = String(key || "").split("/");
      if (parts.length < 3) return;
      const [hand, objId, episode] = parts;
      if (!hand || !objId || episode == null || episode === "") return;
      catalog[hand] ||= {};
      catalog[hand][objId] ||= [];
      catalog[hand][objId].push(String(episode));
    }

    function bindEvents() {
      ["hand-filter", "outcome-filter"].forEach(id => {
        els[id].addEventListener("change", renderAll);
      });

      els["download-trigger"].addEventListener("click", toggleDownloadMenu);
      els["version-trigger"].addEventListener("click", toggleVersionMenu);
      ["download-tab-full", "download-tab-without-video"].forEach(id => {
        els[id].addEventListener("click", () => {
          state.downloadMode = els[id].dataset.downloadMode;
          updateDownloadCommand(currentEpisode());
        });
      });
      els["copy-download-command"].addEventListener("click", copyDownloadCommand);
      els["camera-view-select"].addEventListener("change", () => {
        const ep = currentEpisode();
        const camera = els["camera-view-select"].value;
        if (!ep || !camera) return;
        state.currentViewCamera = camera;
        applyDatasetCameraView(ep, camera);
        writeStateUrl();
      });
      document.addEventListener("pointerdown", event => {
        if ((state.downloadMenuOpen || state.versionMenuOpen) && !els["viewer-actions"].contains(event.target)) {
          setDownloadMenuOpen(false);
          setVersionMenuOpen(false);
        }
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && (state.downloadMenuOpen || state.versionMenuOpen)) {
          const focusTarget = state.versionMenuOpen ? els["version-trigger"] : els["download-trigger"];
          setDownloadMenuOpen(false);
          setVersionMenuOpen(false);
          focusTarget.focus();
        }
      });

      ["object", "pose"].forEach(name => {
        const rail = els[`${name}-strip`];
        const header = els[`${name}-header`];
        attachRailAutoScroll(rail);

        header.addEventListener("click", () => {
          state.openSelectors[name] = !state.openSelectors[name];
          updateSelectorOpenState();
        });
      });
    }

    function bindTileActivation(tile, onActivate) {
      let pointerActivated = false;

      tile.addEventListener("pointerdown", event => {
        if (event.button !== 0) return;
        pointerActivated = true;
        event.preventDefault();
        event.stopPropagation();
        stopRailAutoScroll();
        onActivate();
      });

      tile.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        if (pointerActivated) {
          pointerActivated = false;
          return;
        }
        stopRailAutoScroll();
        onActivate();
      });
    }

    function attachRailAutoScroll(rail) {
      rail.addEventListener("pointermove", event => updateRailAutoScroll(rail, event));
      rail.addEventListener("pointerleave", stopRailAutoScroll);
      rail.addEventListener("pointercancel", stopRailAutoScroll);
      rail.addEventListener("wheel", stopRailAutoScroll, { passive: true });
    }

    function updateRailAutoScroll(rail, event) {
      if (!rail || rail.scrollWidth <= rail.clientWidth) {
        stopRailAutoScroll();
        return;
      }

      const rect = rail.getBoundingClientRect();
      const edgeWidth = Math.min(120, Math.max(56, rect.width * 0.18));
      const x = event.clientX - rect.left;
      let velocity = 0;

      if (x < edgeWidth) {
        velocity = -railAutoScrollVelocity(edgeWidth - x, edgeWidth);
      } else if (x > rect.width - edgeWidth) {
        velocity = railAutoScrollVelocity(x - (rect.width - edgeWidth), edgeWidth);
      }

      if (!velocity) {
        stopRailAutoScroll();
        return;
      }

      startRailAutoScroll(rail, velocity);
    }

    function railAutoScrollVelocity(distanceIntoEdge, edgeWidth) {
      const ratio = Math.max(0, Math.min(1, distanceIntoEdge / edgeWidth));
      return 5 + Math.round(ratio * 18);
    }

    function startRailAutoScroll(rail, velocity) {
      state.autoScrollRail = rail;
      state.autoScrollVelocity = velocity;
      if (state.autoScrollFrame) return;

      const step = () => {
        const activeRail = state.autoScrollRail;
        const activeVelocity = state.autoScrollVelocity;
        if (!activeRail || !activeVelocity) {
          state.autoScrollFrame = null;
          return;
        }

        activeRail.scrollLeft += activeVelocity;
        const maxScroll = Math.max(0, activeRail.scrollWidth - activeRail.clientWidth);
        if ((activeRail.scrollLeft <= 0 && activeVelocity < 0) ||
            (activeRail.scrollLeft >= maxScroll && activeVelocity > 0)) {
          stopRailAutoScroll();
          return;
        }

        state.autoScrollFrame = requestAnimationFrame(step);
      };

      state.autoScrollFrame = requestAnimationFrame(step);
    }

    function stopRailAutoScroll() {
      state.autoScrollRail = null;
      state.autoScrollVelocity = 0;
      if (state.autoScrollFrame) {
        cancelAnimationFrame(state.autoScrollFrame);
        state.autoScrollFrame = null;
      }
    }

    function flattenEpisodes() {
      const episodes = [];
      orderedEmbodiments(Object.keys(state.catalog)).forEach(hand => {
        const objects = state.catalog[hand] || {};
        Object.entries(objects).forEach(([objId, sequenceList]) => {
          if (HIDDEN_OBJECT_IDS.has(objId)) return;
          const sequences = Array.isArray(sequenceList) ? sequenceList : Object.keys(sequenceList || {});
          sequences.forEach(rawEpisode => {
            const episode = String(rawEpisode);
            const result = graspResultFor(hand, objId, episode);
            if (hand !== "human" && (
              typeof result?.graspSuccess !== "boolean" ||
              !hasHumanEpisode(objId)
            )) return;
            const outcome = outcomeFor(hand, result);
            episodes.push({
              key: sequenceKey(hand, objId, episode, "|"),
              pathKey: sequenceKey(hand, objId, episode),
              hand,
              objId,
              objName: titleize(objId),
              episode,
              rank: Number.isFinite(Number(episode)) ? Number(episode) : episode,
              rankLabel: poseLabel(hand, objId, episode),
              outcome,
              outcomeLabel: outcomeLabel(outcome),
              has3D: true,
              cameras: [PREVIEW_CAMERA_ID],
              result
            });
          });
        });
      });

      return episodes.sort((a, b) =>
        a.objName.localeCompare(b.objName) ||
        embodimentRank(a.hand) - embodimentRank(b.hand) ||
        Number(a.rank) - Number(b.rank) ||
        String(a.episode).localeCompare(String(b.episode))
      );
    }

    function applyInitialViewParams() {
      const params = new URLSearchParams(location.search);
      const hashParams = new URLSearchParams(location.hash.replace(/^#/, ""));
      for (const [key, value] of hashParams.entries()) {
        if (!params.has(key)) params.set(key, value);
      }

      const open = (params.get("selector") || params.get("open") || "").toLowerCase();
      if (["object", "pose"].includes(open)) state.openSelectors[open] = true;

      const requestedObject = params.get("object");
      const requestedHand = params.get("hand") || params.get("embodiment");
      const requestedEpisode = params.get("episode") || params.get("pose") || params.get("rank");
      const requestedCamera = params.get("camera");
      state.requestedViewCamera = params.get("view");
      if (!requestedObject && !requestedHand && !requestedEpisode) return;

      const target = state.episodes.find(ep =>
        (!requestedObject || ep.objId === requestedObject) &&
        (!requestedHand || ep.hand === requestedHand) &&
        (!requestedEpisode || ep.episode === String(requestedEpisode))
      );
      if (target) {
        state.currentKey = target.key;
        state.currentCamera = requestedCamera && target.cameras.includes(requestedCamera)
          ? requestedCamera
          : target.cameras[0] || null;
        state.mediaRequested = Boolean(state.currentCamera);
      }
    }

    function fillFilters() {
      renderCheckboxGroup("hand-filter", "hand", orderedValues(state.episodes.map(ep => ep.hand), embodimentOrder), labelForHand);
      renderCheckboxGroup("outcome-filter", "outcome", orderedValues(state.episodes.map(ep => ep.outcome), ["success", "fail", "unknown"]), outcomeLabel);
    }

    function orderedValues(values, preferred = []) {
      const set = new Set(values.filter(Boolean));
      return [
        ...preferred.filter(value => set.delete(value)),
        ...[...set].sort((a, b) => titleize(a).localeCompare(titleize(b)))
      ];
    }

    function renderCheckboxGroup(id, name, values, labeler = titleize) {
      els[id].innerHTML = values.map(value =>
        `<label class="check-chip">
          <input type="checkbox" name="${escapeHtml(name)}" value="${escapeHtml(value)}" checked>
          <span>${escapeHtml(labeler(value))}</span>
        </label>`
      ).join("") || '<span class="empty-check">No options</span>';
    }

    function renderSummary() {
      const episodes = filteredEpisodes();
      const objects = new Set(episodes.map(ep => ep.objId)).size;
      const humans = episodes.filter(ep => ep.hand === "human").length;
      const robots = episodes.filter(ep => robotEmbodiments.has(ep.hand)).length;
      els["summary-pills"].innerHTML = [
        `<span class="chip accent">${episodes.length.toLocaleString()} sequences</span>`,
        `<span class="chip">${objects} objects</span>`,
        `<span class="chip info">${humans} human</span>`,
        `<span class="chip">${robots} robot</span>`
      ].join("");
    }

    function selectInitialEpisode() {
      const first = defaultEpisodeFrom(state.episodes);
      if (!first) return;
      state.currentKey = first.key;
      state.currentCamera = first.cameras[0] || null;
      state.mediaRequested = Boolean(state.currentCamera);
    }

    function renderAll() {
      ensureCurrentEpisodeSelection();
      renderSummary();
      renderMainPanel();
      renderSelectorRows();
      writeStateUrl();
    }

    function filters() {
      return {
        hands: checkedValues("hand-filter"),
        outcomes: checkedValues("outcome-filter")
      };
    }

    function checkedValues(id) {
      return new Set([...els[id].querySelectorAll('input[type="checkbox"]:checked')].map(input => input.value));
    }

    function filteredEpisodes() {
      const f = filters();
      return state.episodes.filter(ep =>
        f.hands.has(ep.hand) &&
        f.outcomes.has(ep.outcome)
      );
    }

    function ensureCurrentEpisodeSelection() {
      const visible = filteredEpisodes();
      if (!visible.length) {
        state.currentKey = null;
        state.currentCamera = null;
        state.mediaRequested = false;
        return;
      }

      const current = visible.find(ep => ep.key === state.currentKey);
      if (!current) {
        const next = defaultEpisodeFrom(visible);
        resetViewForSequenceChange(next);
        state.currentKey = next.key;
        state.currentCamera = next.cameras[0] || null;
        state.mediaRequested = Boolean(state.currentCamera);
        return;
      }

      if (!state.currentCamera || !current.cameras.includes(state.currentCamera)) {
        state.currentCamera = current.cameras[0] || null;
      }
      state.mediaRequested = Boolean(state.currentCamera);
    }

    function resetViewForSequenceChange(next) {
      if (!next || state.currentKey === next.key) return;
      state.currentViewCamera = PREVIEW_CAMERA_ID;
      state.requestedViewCamera = null;
    }

    function defaultEpisodeFrom(episodes) {
      return episodes.find(ep => ep.outcome === "success") ||
        episodes[0] ||
        null;
    }

    function currentEpisode() {
      return state.episodes.find(ep => ep.key === state.currentKey) || null;
    }

    function renderMainPanel() {
      const ep = currentEpisode();
      if (!ep) {
        els["selected-title"].textContent = "No matching sequence";
        els["selected-subtitle"].textContent = "";
        updateDownloadCommand(null);
        updateCameraViewSelect(null);
        clearMedia();
        return;
      }

      els["selected-title"].textContent = `${ep.objName} - ${shortLabels[ep.hand] || labelForHand(ep.hand)} - ${graspTitleLabel(ep)}`;
      els["selected-subtitle"].textContent = "";
      updateDownloadCommand(ep);
      updateCameraViewSelect(ep);

      if (state.mediaRequested && state.currentCamera) {
        showVideo(videoUrl(ep, state.currentCamera));
      } else {
        showVideoPending("Video pending", "");
      }

      showModel(modelUrl(ep), ep);
    }

    function updateCameraViewSelect(ep) {
      const select = els["camera-view-select"];
      const menu = els["camera-view-menu"];
      menu.hidden = true;
      if (!ep) {
        select.disabled = true;
        select.innerHTML = "";
        return;
      }

      const cacheKey = ep.pathKey;
      if (!Object.prototype.hasOwnProperty.call(state.datasetCameraExtrinsics, cacheKey)) {
        select.disabled = true;
        select.innerHTML = "";
        loadDatasetCameraViews(ep);
        return;
      }

      const extrinsics = state.datasetCameraExtrinsics[cacheKey];
      const cameras = Object.keys(extrinsics || {}).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
      if (!cameras.length) {
        select.disabled = true;
        select.innerHTML = "";
        return;
      }

      const preferred = state.currentViewCamera === null ? state.requestedViewCamera : state.currentViewCamera;
      state.currentViewCamera = cameras.includes(preferred)
        ? preferred
        : (cameras.includes(PREVIEW_CAMERA_ID) ? PREVIEW_CAMERA_ID : cameras[0]);
      state.requestedViewCamera = null;
      select.disabled = false;
      select.innerHTML = cameras.map(camera =>
        `<option value="${escapeHtml(camera)}">View ${escapeHtml(camera)}</option>`
      ).join("");
      select.value = state.currentViewCamera;
      menu.hidden = !isInteractive3DReady(ep);
    }

    function isInteractive3DReady(ep) {
      return Boolean(ep && viewer3d.model && viewer3d.currentSrc === modelUrl(ep));
    }

    function datasetExtrinsicsUrl(ep) {
      return datasetCameraParamUrl(ep, "extrinsics.json");
    }

    function datasetIntrinsicsUrl(ep) {
      return datasetCameraParamUrl(ep, "intrinsics.json");
    }

    function datasetC2RUrl(ep) {
      const path = [ep.hand, ep.objId, ep.episode, "C2R.npy"]
        .map(part => encodeURIComponent(part))
        .join("/");
      return `${DATASET_BASE}/${path}`;
    }

    function datasetCameraParamUrl(ep, filename) {
      const path = [ep.hand, ep.objId, ep.episode, "cam_param", filename]
        .map(part => encodeURIComponent(part))
        .join("/");
      return `${DATASET_BASE}/${path}`;
    }

    async function loadDatasetCameraViews(ep) {
      const cacheKey = ep.pathKey;
      if (state.datasetCameraLoads[cacheKey]) return state.datasetCameraLoads[cacheKey];
      const fallback = LEGACY_CAMERA_METADATA_FALLBACKS[`${ep.hand}/${ep.objId}`] || null;

      const loadJson = (url, label) => fetch(url).then(response => {
        if (!response.ok) throw new Error(`${label} request failed (${response.status})`);
        return response.json();
      });
      const withFallback = (loadPrimary, loadReference, label) => loadPrimary().catch(error => {
        if (!fallback) throw error;
        console.warn(`${label} is unavailable for ${cacheKey}; using legacy rig calibration.`, error);
        return loadReference();
      });
      const extrinsics = withFallback(
        () => loadJson(datasetExtrinsicsUrl(ep), "Camera extrinsics"),
        () => loadJson(datasetExtrinsicsUrl(fallback), "Legacy camera extrinsics"),
        "Camera extrinsics"
      );
      const intrinsics = withFallback(
        () => loadJson(datasetIntrinsicsUrl(ep), "Camera intrinsics"),
        () => loadJson(datasetIntrinsicsUrl(fallback), "Legacy camera intrinsics"),
        "Camera intrinsics"
      ).catch(error => {
        console.warn("Could not load dataset camera intrinsics", error);
        return null;
      });
      const c2r = withFallback(
        () => fetchNpyMatrix(datasetC2RUrl(ep), "C2R"),
        () => fetchNpyMatrix(datasetC2RUrl(fallback), "Legacy C2R"),
        "C2R"
      ).catch(error => {
        console.warn("Could not load C2R", error);
        return null;
      });
      state.datasetCameraLoads[cacheKey] = Promise.all([
        extrinsics,
        intrinsics,
        c2r
      ])
        .then(([extrinsics, intrinsics, c2r]) => {
          state.datasetCameraExtrinsics[cacheKey] = extrinsics && typeof extrinsics === "object" ? extrinsics : null;
          state.datasetCameraIntrinsics[cacheKey] = intrinsics && typeof intrinsics === "object" ? intrinsics : null;
          state.datasetCameraC2R[cacheKey] = c2r;
        })
        .catch(error => {
          console.warn("Could not load dataset camera metadata", error);
          state.datasetCameraExtrinsics[cacheKey] = null;
          state.datasetCameraIntrinsics[cacheKey] = null;
          state.datasetCameraC2R[cacheKey] = null;
        })
        .finally(() => {
          delete state.datasetCameraLoads[cacheKey];
          const current = currentEpisode();
          if (!current || current.pathKey !== cacheKey) return;
          updateCameraViewSelect(current);
          applyDatasetCameraView(current, state.currentViewCamera);
          updateDatasetFloorGrid(viewer3d.model);
          writeStateUrl();
        });
      return state.datasetCameraLoads[cacheKey];
    }

    function renderSelectorRows() {
      updateSelectorHeaders();
      updateSelectorOpenState();
      renderObjectRow();
      renderPoseRow();
    }

    function updateSelectorOpenState() {
      ["object", "pose"].forEach(name => {
        const open = state.openSelectors[name];
        els[`${name}-selector`].classList.toggle("open", open);
        els[`${name}-header`].setAttribute("aria-expanded", String(open));
      });
    }

    function updateSelectorHeaders() {
      const ep = currentEpisode();
      if (!ep) {
        els["object-value"].textContent = "-";
        els["pose-value"].textContent = "-";
        return;
      }
      els["object-value"].textContent = ep.objName;
      els["pose-value"].textContent = ep.rankLabel;
    }

    function renderObjectRow() {
      const episodes = filteredEpisodes();
      const byObject = new Map();
      episodes.forEach(ep => {
        const item = byObject.get(ep.objId) || {
          id: ep.objId,
          name: ep.objName,
          episodes: 0,
          human: 0,
          robot: 0
        };
        item.episodes += 1;
        if (ep.hand === "human") item.human += 1;
        if (robotEmbodiments.has(ep.hand)) item.robot += 1;
        byObject.set(ep.objId, item);
      });

      const items = [...byObject.values()].sort((a, b) => a.name.localeCompare(b.name));
      els["object-count"].textContent = `${items.length} objects`;
      els["object-strip"].innerHTML = items.map(item => {
        const active = currentEpisode()?.objId === item.id;
        return `<button class="object-tile ${active ? "active" : ""}" data-object="${escapeHtml(item.id)}">
          <img src="${objectThumbUrl(item.id)}" data-fallback-src="${objectThumbUrl(item.id, THUMB_FALLBACK_BASE)}" alt="${escapeHtml(item.name)}" loading="eager">
          <div class="tile-body">
            <div class="tile-title">${escapeHtml(item.name)}</div>
            <div class="status-line">
              <span class="chip info">${item.human} human</span>
              <span class="chip">${item.robot} robot</span>
            </div>
          </div>
        </button>`;
      }).join("") || '<div class="empty-inline">No matching objects.</div>';

      els["object-strip"].querySelectorAll(".object-tile").forEach(btn => {
        bindTileActivation(btn, () => {
          const next = matchingObjectEpisode(btn.dataset.object) ||
            state.episodes.find(ep => ep.objId === btn.dataset.object);
          if (!next) return;
          resetViewForSequenceChange(next);
          state.currentKey = next.key;
          state.currentCamera = next.cameras[0] || null;
          state.mediaRequested = true;
          renderAll();
        });
      });
      bindObjectThumbnailFallbacks();
    }

    function matchingObjectEpisode(objId) {
      return filteredEpisodes().find(ep => ep.objId === objId);
    }

    function renderPoseRow() {
      const ep = currentEpisode();
      if (!ep) {
        els["pose-count"].textContent = "0 poses";
        els["pose-strip"].innerHTML = '<div class="empty-inline">No sequence selected.</div>';
        return;
      }

      const poseItems = filteredEpisodes()
        .filter(item => item.objId === ep.objId)
        .slice(0, 72);

      els["pose-count"].textContent = `${poseItems.length} pose candidates`;
      els["pose-strip"].innerHTML = poseItems.map(item => {
        const active = item.key === state.currentKey;
        return `<button class="pose-tile ${active ? "active" : ""}" data-key="${escapeHtml(item.key)}">
          <video src="${previewThumbnailUrl(item)}" muted loop playsinline preload="metadata"></video>
          <div class="tile-body">
            <div class="pose-title-row">
              <div class="tile-title">${escapeHtml(item.rankLabel)}</div>
              <span class="chip ${item.outcome === "success" ? "ok" : item.outcome === "fail" ? "warn" : "info"}">${escapeHtml(item.outcomeLabel)}</span>
            </div>
          </div>
        </button>`;
      }).join("") || '<div class="empty-inline">No matching pose candidates.</div>';

      els["pose-strip"].querySelectorAll(".pose-tile").forEach(btn => {
        bindTileActivation(btn, () => {
          const next = state.episodes.find(ep => ep.key === btn.dataset.key);
          if (!next) return;
          resetViewForSequenceChange(next);
          state.currentKey = next.key;
          state.currentCamera = next?.cameras?.[0] || null;
          state.mediaRequested = true;
          renderAll();
        });
        const vid = btn.querySelector("video");
        btn.addEventListener("mouseenter", () => vid.play().catch(() => {}));
        btn.addEventListener("mouseleave", () => {
          vid.pause();
          const item = state.episodes.find(ep => ep.key === btn.dataset.key);
          seekPoseThumbnailVideo(item, vid);
        });
      });
      bindPoseThumbnailTimes();
    }

    function showVideo(src) {
      bindSynchronizedPlaybackEvents();
      els["video-pending-layer"].classList.remove("visible");
      const video = els["main-video"];
      video.style.display = "block";
      video.muted = true;
      video.autoplay = true;
      video.playbackRate = playbackSpeed();
      video.onerror = () => showVideoPending("Video unavailable", "");
      const tryPlay = () => video.play().catch(() => {});
      if (video.src !== new URL(src, window.location.href).href) {
        video.src = src;
        video.load();
      }
      syncInteractive3DToVideo({ force: true });
      tryPlay();
      video.addEventListener("canplay", tryPlay, { once: true });
    }

    function showModel(src, ep) {
      els["pending-layer"].classList.remove("visible");
      showInteractive3D(src, ep);
    }

    function showVideoPending(title, copy) {
      const video = els["main-video"];
      video.pause();
      video.removeAttribute("src");
      video.onerror = null;
      video.load();
      video.style.display = "none";
      els["video-pending-title"].textContent = title;
      els["video-pending-copy"].textContent = copy;
      els["video-pending-layer"].classList.add("visible");
    }

    function showModelPending(title, copy) {
      hideInteractive3D({ clear: true });
      els["pending-title"].textContent = title;
      els["pending-copy"].textContent = copy;
      els["pending-layer"].classList.add("visible");
    }

    function clearMedia() {
      showVideoPending("No sequence selected", "");
      showModelPending("No sequence selected", "");
    }

    async function showInteractive3D(src, ep) {
      // Reuse the in-flight request when rendering the same selected target.
      if (viewer3d.currentSrc === src && viewer3d.fetchAbortController) return;
      if (viewer3d.fetchAbortController && viewer3d.currentSrc !== src) {
        viewer3d.fetchAbortController?.abort();
        viewer3d.fetchAbortController = null;
      }
      const token = ++viewer3d.loadToken;
      els["interactive-3d-viewer"].style.display = "block";
      els["camera-view-menu"].hidden = true;
      setInteractive3DStatus("Loading interactive 3D...");
      try {
        await ensureInteractive3D();
        if (token !== viewer3d.loadToken) return;
        await loadInteractive3DModel(src, ep, token);
      } catch (error) {
        if (token !== viewer3d.loadToken) return;
        console.error(error);
        setInteractive3DStatus(`Interactive 3D failed: ${error.message || error}`);
      }
    }

    function hideInteractive3D({ clear = false } = {}) {
      if (clear) {
        viewer3d.loadToken += 1;
        viewer3d.fetchAbortController?.abort();
        viewer3d.fetchAbortController = null;
      }
      els["interactive-3d-viewer"].style.display = "none";
      viewer3d.playing = false;
      updateInteractivePlayButton();
      setInteractive3DStatus();
      if (clear) clearInteractive3DModel();
    }

    function setInteractive3DStatus(message = "", copy = "") {
      const status = els["interactive-3d-status"];
      if (!message) {
        status.textContent = "";
        status.style.display = "none";
        return;
      }
      status.textContent = copy ? `${message} ${copy}` : message;
      status.style.display = "";
    }

    async function ensureInteractive3D() {
      if (viewer3d.initialized) {
        resizeInteractive3D();
        return;
      }
      if (viewer3d.loading) return viewer3d.loading;

      viewer3d.loading = (async () => {
        const [threeModule, controlsModule, loaderModule, meshoptModule] = await Promise.all([
          import(THREE_MODULE_URL),
          import(ORBIT_CONTROLS_URL),
          import(GLTF_LOADER_URL),
          import(MESHOPT_DECODER_URL)
        ]);
        viewer3d.THREE = threeModule;
        viewer3d.OrbitControls = controlsModule.OrbitControls;
        viewer3d.GLTFLoader = loaderModule.GLTFLoader;
        viewer3d.MeshoptDecoder = meshoptModule.MeshoptDecoder;
        viewer3d.clock = new viewer3d.THREE.Clock();

        viewer3d.scene = new viewer3d.THREE.Scene();
        viewer3d.scene.background = new viewer3d.THREE.Color(0xf7f8f4);
        viewer3d.camera = new viewer3d.THREE.PerspectiveCamera(45, 1, 0.001, 1000);
        viewer3d.assetRoot = new viewer3d.THREE.Group();
        viewer3d.scene.add(viewer3d.assetRoot);

        viewer3d.renderer = new viewer3d.THREE.WebGLRenderer({ antialias: true, alpha: false });
        viewer3d.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        viewer3d.renderer.outputColorSpace = viewer3d.THREE.SRGBColorSpace;
        viewer3d.renderer.toneMapping = viewer3d.THREE.ACESFilmicToneMapping;
        viewer3d.renderer.toneMappingExposure = 0.95;
        viewer3d.renderer.shadowMap.enabled = false;
        els["interactive-3d-canvas"].appendChild(viewer3d.renderer.domElement);

        viewer3d.controls = new viewer3d.OrbitControls(viewer3d.camera, viewer3d.renderer.domElement);
        viewer3d.controls.enableDamping = true;
        viewer3d.controls.dampingFactor = 0.08;
        viewer3d.controls.enablePan = true;
        viewer3d.controls.enableRotate = true;
        viewer3d.controls.enableZoom = true;
        viewer3d.controls.screenSpacePanning = true;

        const keyLight = new viewer3d.THREE.DirectionalLight(0xffffff, 3);
        keyLight.position.set(-0.2, 1, -0.2);
        keyLight.castShadow = false;
        viewer3d.scene.add(keyLight);
        viewer3d.scene.add(keyLight.target);
        const fillLight = new viewer3d.THREE.DirectionalLight(0xffffff, 0.4);
        fillLight.position.set(0, -1, 0);
        viewer3d.scene.add(fillLight);
        // Match the Viser animation viewer's uniform ambient fill. This is
        // direction-independent, so textured vertical surfaces stay visible.
        viewer3d.scene.add(new viewer3d.THREE.AmbientLight(0xffffff, 0.5));
        viewer3d.grid = new viewer3d.THREE.GridHelper(2, 20, 0x7a8795, 0xb2bac2);
        viewer3d.grid.material.transparent = true;
        viewer3d.grid.material.opacity = 0.58;
        viewer3d.grid.visible = false;
        viewer3d.scene.add(viewer3d.grid);
        loadViserDefaultEnvironment();

        bindSynchronizedPlaybackEvents();
        els["interactive-3d-play"].addEventListener("click", toggleSynchronizedPlayback);
        els["interactive-3d-scrub"].addEventListener("input", () => {
          const t = (Number(els["interactive-3d-scrub"].value) || 0) / 1000;
          seekSynchronizedPlayback(t);
        });
        els["interactive-3d-speed"].addEventListener("change", () => {
          const video = els["main-video"];
          const speed = playbackSpeed();
          if (video) video.playbackRate = speed;
          viewer3d.clock.getDelta();
          syncInteractive3DToVideo({ force: true });
        });

        viewer3d.resizeObserver = new ResizeObserver(resizeInteractive3D);
        viewer3d.resizeObserver.observe(els["interactive-3d-viewer"]);
        window.addEventListener("resize", resizeInteractive3D);
        viewer3d.initialized = true;
        resizeInteractive3D();
        animateInteractive3D();
      })();
      return viewer3d.loading;
    }

    function resizeInteractive3D() {
      if (!viewer3d.renderer || !viewer3d.camera) return;
      const rect = els["interactive-3d-viewer"].getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      viewer3d.camera.aspect = rect.width / rect.height;
      viewer3d.renderer.setSize(rect.width, rect.height, false);
      updateInteractiveCameraProjection();
    }

    function updateInteractiveCameraProjection() {
      const camera = viewer3d.camera;
      const calibration = viewer3d.cameraCalibration;
      if (!camera) return;
      if (!calibration) {
        camera.updateProjectionMatrix();
        return;
      }

      const { fx, fy, cx, cy, width, height } = calibration;
      camera.aspect = width / height;
      const near = camera.near;
      const left = -near * cx / fx;
      const right = near * (width - cx) / fx;
      const top = near * cy / fy;
      const bottom = -near * (height - cy) / fy;
      camera.projectionMatrix.makePerspective(left, right, top, bottom, near, camera.far);
      camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
    }

    function loadViserDefaultEnvironment() {
      const THREE = viewer3d.THREE;
      const textureLoader = new THREE.TextureLoader();
      textureLoader.setCrossOrigin("anonymous");
      textureLoader.load(VISER_CITY_ENVIRONMENT_URL, texture => {
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.mapping = THREE.EquirectangularReflectionMapping;
        viewer3d.scene.environment = texture;
        viewer3d.scene.environmentIntensity = 1;
      }, undefined, error => {
        console.warn("Could not load viser default environment", error);
      });
    }

    async function loadInteractive3DModel(src, ep, token) {
      if (viewer3d.currentSrc === src && viewer3d.model) {
        viewer3d.currentHand = ep.hand;
        applyDatasetCameraView(ep, state.currentViewCamera);
        viewer3d.playing = true;
        updateInteractivePlayButton();
        setInteractive3DStatus();
        updateCameraViewSelect(ep);
        return;
      }

      clearInteractive3DModel();
      resetViewerZoomAuto();
      viewer3d.currentSrc = src;
      viewer3d.currentHand = ep.hand;
      setInteractive3DStatus("Fetching animated GLB...");

      const loader = new viewer3d.GLTFLoader();
      loader.setCrossOrigin("anonymous");
      if (viewer3d.MeshoptDecoder) loader.setMeshoptDecoder(viewer3d.MeshoptDecoder);

      const fetchAbortController = new AbortController();
      viewer3d.fetchAbortController = fetchAbortController;
      let glbBuffer;
      try {
        glbBuffer = await fetchArrayBufferWithProgress(src, progress => {
          if (token !== viewer3d.loadToken) return;
          setInteractive3DStatus("Loading animated GLB...", `${progress.toFixed(0)}%`);
        }, fetchAbortController.signal);
      } finally {
        if (viewer3d.fetchAbortController === fetchAbortController) {
          viewer3d.fetchAbortController = null;
        }
      }
      const gltf = await new Promise((resolve, reject) => {
        loader.parse(glbBuffer, src.replace(/[^/]*$/, ""), resolve, reject);
      });

      if (token !== viewer3d.loadToken || viewer3d.currentSrc !== src) {
        disposeObject3D(gltf.scene);
        return;
      }

      const loadedModel = gltf.scene;
      // Every published GLB carries its own floor_grid. Keep that embedded
      // floor as the single floor source and exclude it from framing bounds.
      loadedModel.traverse(node => {
        if (!node.isMesh) return;
        node.castShadow = false;
        node.receiveShadow = false;
      });
      loadedModel.rotation.set(-Math.PI / 2, 0, 0);
      loadedModel.updateMatrixWorld(true);
      viewer3d.model = loadedModel;
      viewer3d.assetRoot.add(viewer3d.model);
      playAnimations(gltf, ep);
      setInteractive3DTime(0, { render: false });
      frameInteractiveModel(loadedModel, ep.hand, { updateAutoZoom: true });
      applyDatasetCameraView(ep, state.currentViewCamera);
      syncInteractive3DToVideo({ force: true, render: false });
      viewer3d.renderer.render(viewer3d.scene, viewer3d.camera);
      setInteractive3DStatus();
      updateCameraViewSelect(ep);
    }

    async function fetchArrayBufferWithProgress(url, onProgress, signal) {
      const response = await fetch(url, { signal });
      if (!response.ok) throw new Error(`GLB request failed (${response.status})`);

      const total = Number(response.headers.get("content-length")) || 0;
      if (!response.body || !total) {
        const buffer = await response.arrayBuffer();
        onProgress?.(100);
        return buffer;
      }

      const reader = response.body.getReader();
      const chunks = [];
      let received = 0;
      let lastPct = -1;
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.byteLength;
        const pct = Math.max(0, Math.min(100, received / total * 100));
        const rounded = Math.floor(pct);
        if (rounded !== lastPct) {
          lastPct = rounded;
          onProgress?.(pct);
        }
      }

      const output = new Uint8Array(received);
      let offset = 0;
      chunks.forEach(chunk => {
        output.set(chunk, offset);
        offset += chunk.byteLength;
      });
      onProgress?.(100);
      return output.buffer;
    }

    function clearInteractive3DModel() {
      viewer3d.mixer?.stopAllAction?.();
      if (viewer3d.assetRoot) {
        [...viewer3d.assetRoot.children].forEach(child => {
          viewer3d.assetRoot.remove(child);
          disposeObject3D(child);
        });
      }
      viewer3d.model = null;
      viewer3d.mixer = null;
      viewer3d.duration = 0;
      viewer3d.clipDuration = 0;
      viewer3d.currentSrc = "";
      els["camera-view-menu"].hidden = true;
      els["interactive-3d-scrub"].value = "0";
      els["interactive-3d-readout"].textContent = "0.00s";
    }

    function disposeObject3D(root) {
      root?.traverse?.(node => {
        node.geometry?.dispose?.();
        const materials = Array.isArray(node.material) ? node.material : [node.material].filter(Boolean);
        materials.forEach(material => material.dispose?.());
      });
    }

    function playAnimations(gltf, ep) {
      const THREE = viewer3d.THREE;
      const clips = gltf.animations || [];
      if (!clips.length) {
        viewer3d.duration = 0;
        viewer3d.clipDuration = 0;
        return;
      }

      viewer3d.mixer = new THREE.AnimationMixer(viewer3d.model);
      viewer3d.clipDuration = Math.max(...clips.map(clip => clip.duration || 0));
      viewer3d.duration = viewer3d.clipDuration;

      clips.forEach(clip => {
        const action = viewer3d.mixer.clipAction(clip);
        action.reset();
        action.setLoop(THREE.LoopRepeat, Infinity);
        action.play();
      });

      els["interactive-3d-scrub"].max = String(Math.max(1, Math.round(viewer3d.duration * 1000)));
      viewer3d.playing = true;
      updateInteractivePlayButton();
    }

    function resetInteractive3DView({ resetTime = false } = {}) {
      if (!viewer3d.model || !viewer3d.controls || !viewer3d.camera) return;
      if (resetTime && viewer3d.mixer) setInteractive3DTime(0, { render: false });
      frameInteractiveModel(viewer3d.model, viewer3d.currentHand || "default");
      applyDatasetCameraView(currentEpisode(), state.currentViewCamera);
      viewer3d.clock?.getDelta?.();
      viewer3d.renderer?.render(viewer3d.scene, viewer3d.camera);
    }

    function frameInteractiveModel(object, embodiment, options = {}) {
      const THREE = viewer3d.THREE;
      const box = boundsExcludingFloorGrid(object);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const objectCenter = objectMeshMeanCenter(object);
      if (options.updateAutoZoom) setAutoZoomFromObjectCenter(objectCenter);

      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const preset = CAMERA_PRESETS[embodiment] || CAMERA_PRESETS.default;
      viewer3d.cameraCalibration = null;
      viewer3d.camera.fov = CAMERA_FOV;
      const distance = maxDim / (2 * Math.tan(THREE.MathUtils.degToRad(viewer3d.camera.fov) / 2));
      const viewDirection = new THREE.Vector3(...preset.viewDirection).normalize();
      const presetFocus = new THREE.Vector3(
        maxDim * preset.focus[0],
        maxDim * preset.focus[1],
        maxDim * preset.focus[2]
      );
      const focus = objectCenter ? objectCenter.clone().sub(center) : presetFocus;

      object.position.sub(center);
      object.updateMatrixWorld(true);
      updateDatasetFloorGrid(object);
      viewer3d.camera.up.set(0, 1, 0);
      viewer3d.controls.target.copy(focus);
      viewer3d.camera.near = Math.max(maxDim / 1000, 0.001);
      viewer3d.camera.far = Math.max(maxDim * 100, 100);
      viewer3d.camera.position.copy(focus).addScaledVector(viewDirection, distance * CAMERA_DISTANCE_SCALE * viewer3d.zoomScale);
      updateInteractiveCameraProjection();
      viewer3d.controls.update();
      resizeInteractive3D();
    }

    function boundsExcludingFloorGrid(object) {
      const THREE = viewer3d.THREE;
      const bounds = new THREE.Box3();
      const meshBounds = new THREE.Box3();
      object.updateMatrixWorld(true);
      object.traverse(node => {
        if (!node.isMesh || (node.name || "").toLowerCase() === "floor_grid" || !node.geometry) return;
        if (!node.geometry.boundingBox) node.geometry.computeBoundingBox();
        meshBounds.copy(node.geometry.boundingBox).applyMatrix4(node.matrixWorld);
        bounds.union(meshBounds);
      });
      return bounds.isEmpty() ? new THREE.Box3().setFromObject(object) : bounds;
    }

    function applyDatasetCameraView(ep, cameraId) {
      const THREE = viewer3d.THREE;
      const rows = ep && cameraId ? state.datasetCameraExtrinsics[ep.pathKey]?.[cameraId] : null;
      if (!THREE || !viewer3d.model || !viewer3d.camera || !viewer3d.controls || !isDatasetExtrinsic(rows)) {
        return false;
      }

      const values = rows.flat();
      const worldToCamera = new THREE.Matrix4().set(...values, 0, 0, 0, 1);
      const cameraToWorld = worldToCamera.invert();
      // Dataset cameras use x-right, y-down, z-forward; Three.js uses x-right, y-up, z-back.
      const cvToThreeCamera = new THREE.Matrix4().makeRotationX(Math.PI);
      viewer3d.model.updateMatrixWorld(true);
      const coordinateFix = findDatasetCoordinateRoot(viewer3d.model);
      // v2 human GLBs already contain the C2R conversion. Applying it again
      // would shift every non-legacy human camera view. Legacy human GLBs do
      // not have a coordinate_fix_* root, so only they need inverse(C2R).
      // Robot GLBs retain the original camera conversion path.
      const needsC2R = robotEmbodiments.has(ep.hand) || !coordinateFix;
      const c2r = needsC2R
        ? matrixFromValues(state.datasetCameraC2R[ep.pathKey])
        : new THREE.Matrix4();
      // Convert only coordinate frames which are not already baked into the GLB.
      const cameraWorld = (coordinateFix?.matrixWorld || viewer3d.model.matrixWorld).clone()
        .multiply(c2r.invert())
        .multiply(cameraToWorld)
        .multiply(cvToThreeCamera);
      const cameraScale = new THREE.Vector3();
      cameraWorld.decompose(viewer3d.camera.position, viewer3d.camera.quaternion, cameraScale);

      setDatasetCameraCalibration(state.datasetCameraIntrinsics[ep.pathKey]?.[cameraId]);
      const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(viewer3d.camera.quaternion);
      viewer3d.camera.up.set(0, 1, 0).applyQuaternion(viewer3d.camera.quaternion).normalize();
      viewer3d.controls.target.copy(viewer3d.camera.position).add(forward);
      updateInteractiveCameraProjection();
      viewer3d.controls.update();
      viewer3d.renderer?.render(viewer3d.scene, viewer3d.camera);
      return true;
    }

    function findDatasetCoordinateRoot(model) {
      let coordinateRoot = null;
      model.traverse(node => {
        if (!coordinateRoot && /^coordinate_fix_/i.test(node.name || "")) coordinateRoot = node;
      });
      return coordinateRoot;
    }

    function setDatasetCameraCalibration(cameraEntry) {
      const matrix = cameraEntry?.original_intrinsics;
      const width = Number(cameraEntry?.width);
      const height = Number(cameraEntry?.height);
      const fx = Number(matrix?.[0]?.[0]);
      const fy = Number(matrix?.[1]?.[1]);
      const cx = Number(matrix?.[0]?.[2]);
      const cy = Number(matrix?.[1]?.[2]);
      if (![width, height, fx, fy, cx, cy].every(Number.isFinite) || width <= 0 || height <= 0 || fx <= 0 || fy <= 0) {
        viewer3d.cameraCalibration = null;
        return;
      }

      viewer3d.cameraCalibration = { fx, fy, cx, cy, width, height };
      viewer3d.camera.fov = viewer3d.THREE.MathUtils.radToDeg(2 * Math.atan(height / (2 * fy)));
    }

    function updateDatasetFloorGrid(model) {
      const grid = viewer3d.grid;
      if (!grid || !model) return;
      // The dataset floor is serialized in the GLB; never render a second
      // Three.js GridHelper floor on top of it.
      grid.visible = false;
    }

    async function fetchNpyMatrix(url, label) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`${label} request failed (${response.status})`);
      const buffer = await response.arrayBuffer();
      const bytes = new Uint8Array(buffer);
      if (String.fromCharCode(...bytes.slice(0, 6)) !== "\u0093NUMPY") {
        throw new Error(`${label} is not a NumPy array`);
      }
      const majorVersion = bytes[6];
      const headerLengthBytes = majorVersion === 1 ? 2 : 4;
      const headerLengthView = new DataView(buffer, 8, headerLengthBytes);
      const headerLength = majorVersion === 1
        ? headerLengthView.getUint16(0, true)
        : headerLengthView.getUint32(0, true);
      const dataOffset = 8 + headerLengthBytes + headerLength;
      const header = new TextDecoder("latin1").decode(bytes.slice(8 + headerLengthBytes, dataOffset));
      const descriptor = header.match(/'descr':\s*'([^']+)'/)?.[1];
      const shape = header.match(/'shape':\s*\(([^)]*)\)/)?.[1]
        .split(",").map(value => Number(value.trim())).filter(Number.isFinite);
      if (!descriptor || shape?.length !== 2 || shape[0] !== 4 || shape[1] !== 4) {
        throw new Error(`${label} must be a 4x4 NumPy array`);
      }
      const littleEndian = !descriptor.startsWith(">");
      const isFloat64 = /f8$/.test(descriptor);
      const isFloat32 = /f4$/.test(descriptor);
      if (!isFloat64 && !isFloat32) throw new Error(`${label} has unsupported dtype ${descriptor}`);
      const view = new DataView(buffer, dataOffset);
      const bytesPerValue = isFloat64 ? 8 : 4;
      return Array.from({ length: 16 }, (_, index) => isFloat64
        ? view.getFloat64(index * bytesPerValue, littleEndian)
        : view.getFloat32(index * bytesPerValue, littleEndian));
    }

    function matrixFromValues(values) {
      const THREE = viewer3d.THREE;
      return Array.isArray(values) && values.length === 16 && values.every(Number.isFinite)
        ? new THREE.Matrix4().set(...values)
        : new THREE.Matrix4();
    }

    function isDatasetExtrinsic(rows) {
      return Array.isArray(rows) && rows.length === 3 && rows.every(row =>
        Array.isArray(row) && row.length === 4 && row.every(Number.isFinite)
      );
    }

    function isObjectMeshNode(node) {
      if (!node?.isMesh) return false;
      let current = node;
      while (current) {
        const nodeName = (current.name || "").toLowerCase();
        if (nodeName.startsWith("object_") || nodeName.includes("object")) return true;
        current = current.parent;
      }
      return false;
    }

    function objectMeshMeanCenter(object) {
      const THREE = viewer3d.THREE;
      const center = new THREE.Vector3();
      const vertex = new THREE.Vector3();
      let count = 0;

      object.updateMatrixWorld(true);
      object.traverse(node => {
        if (!isObjectMeshNode(node) || !node.geometry) return;
        const position = node.geometry.getAttribute("position");
        if (!position) return;

        for (let i = 0; i < position.count; i += 1) {
          vertex.fromBufferAttribute(position, i);
          if (node.isSkinnedMesh && typeof node.boneTransform === "function") {
            node.boneTransform(i, vertex);
          }
          vertex.applyMatrix4(node.matrixWorld);
          center.add(vertex);
          count += 1;
        }
      });

      return count ? center.multiplyScalar(1 / count) : null;
    }

    function setAutoZoomFromObjectCenter(objectCenter) {
      viewer3d.objectCenterY = Number.isFinite(objectCenter?.y) ? objectCenter.y : null;
      viewer3d.autoZoomScale = zoomScaleForObjectCenterY(viewer3d.objectCenterY);
      viewer3d.zoomScale = viewer3d.autoZoomScale;
    }

    function resetViewerZoomAuto() {
      viewer3d.objectCenterY = null;
      viewer3d.autoZoomScale = DEFAULT_VIEW_ZOOM_SCALE;
      viewer3d.zoomScale = DEFAULT_VIEW_ZOOM_SCALE;
    }

    function zoomScaleForObjectCenterY(centerY) {
      if (!Number.isFinite(centerY)) return DEFAULT_VIEW_ZOOM_SCALE;
      const referenceSpan = VIEW_ZOOM_GREEN_CACTUS_VASE_CENTER_Y - VIEW_ZOOM_APPLE_CENTER_Y;
      const zoomSpan = VIEW_ZOOM_GREEN_CACTUS_VASE_SCALE - VIEW_ZOOM_MIN_SCALE;
      const scale = VIEW_ZOOM_MIN_SCALE + ((centerY - VIEW_ZOOM_APPLE_CENTER_Y) / referenceSpan) * zoomSpan;
      return Math.max(VIEW_ZOOM_MIN_SCALE, Math.min(VIEW_ZOOM_MAX_SCALE, scale));
    }

    function bindSynchronizedPlaybackEvents() {
      if (viewer3d.syncEventsBound) return;
      const video = els["main-video"];
      if (!video) return;
      viewer3d.syncEventsBound = true;

      video.addEventListener("play", () => {
        viewer3d.playing = true;
        viewer3d.clock?.getDelta?.();
        syncInteractive3DToVideo({ force: true });
        updateInteractivePlayButton();
      });
      video.addEventListener("pause", () => {
        viewer3d.playing = false;
        syncInteractive3DToVideo({ force: true });
        updateInteractivePlayButton();
      });
      video.addEventListener("ended", () => {
        viewer3d.playing = false;
        syncInteractive3DToVideo({ force: true });
        updateInteractivePlayButton();
      });
      video.addEventListener("emptied", () => {
        viewer3d.playing = false;
        updateInteractivePlayButton();
      });
      ["loadedmetadata", "canplay", "seeking", "seeked", "timeupdate", "waiting", "stalled", "ratechange"].forEach(eventName => {
        video.addEventListener(eventName, () => syncInteractive3DToVideo({ force: true }));
      });
    }

    function playbackSpeed() {
      return Number(els["interactive-3d-speed"].value) || 1;
    }

    function hasVideoSource(video = els["main-video"]) {
      return Boolean(video?.getAttribute("src")) && getComputedStyle(video).display !== "none";
    }

    function shouldSyncInteractive3DToVideo() {
      return Boolean(viewer3d.mixer && viewer3d.duration && hasVideoSource());
    }

    function videoSyncedTime(video = els["main-video"]) {
      const raw = Number.isFinite(video?.currentTime) ? video.currentTime : 0;
      const videoDuration = Number.isFinite(video?.duration) && video.duration > 0 ? video.duration : null;
      if (videoDuration && viewer3d.duration) {
        return Math.max(0, Math.min(viewer3d.duration, (raw / videoDuration) * viewer3d.duration));
      }
      if (!viewer3d.duration) return Math.max(0, raw);
      return wrapTime(raw, viewer3d.duration);
    }

    function syncInteractive3DToVideo({ force = false, render = true } = {}) {
      if (!shouldSyncInteractive3DToVideo()) return false;
      const video = els["main-video"];
      const target = videoSyncedTime(video);
      const current = currentAnimationTime();
      const videoAdvancing = !video.paused && !video.ended;
      if (force || videoAdvancing || video.seeking || Math.abs(current - target) > 0.025) {
        setInteractive3DTime(target, { render });
      }
      viewer3d.playing = videoAdvancing;
      updateInteractivePlayButton();
      return true;
    }

    function toggleSynchronizedPlayback() {
      const video = els["main-video"];
      if (hasVideoSource(video)) {
        if (video.paused || video.ended) {
          video.play().catch(() => {});
        } else {
          video.pause();
        }
        syncInteractive3DToVideo({ force: true });
        return;
      }

      viewer3d.playing = !viewer3d.playing;
      viewer3d.clock?.getDelta?.();
      updateInteractivePlayButton();
    }

    function seekSynchronizedPlayback(timeSec) {
      const video = els["main-video"];
      if (hasVideoSource(video) && Number.isFinite(video.duration) && video.duration > 0 && viewer3d.duration) {
        const ratio = Math.max(0, Math.min(1, timeSec / viewer3d.duration));
        video.currentTime = Math.max(0, Math.min(ratio * video.duration, Math.max(0, video.duration - 0.001)));
      }
      setInteractive3DTime(timeSec);
      syncInteractive3DToVideo({ force: true });
    }

    function setInteractive3DTime(timeSec, { render = true } = {}) {
      if (!viewer3d.mixer) return;
      const t = Math.max(0, Math.min(timeSec, viewer3d.duration || timeSec));
      viewer3d.mixer.setTime(t);
      viewer3d.model?.updateMatrixWorld(true);
      els["interactive-3d-scrub"].value = String(Math.round(t * 1000));
      els["interactive-3d-readout"].textContent = `${t.toFixed(2)}s`;
      if (render) viewer3d.renderer?.render(viewer3d.scene, viewer3d.camera);
    }

    function updateInteractivePlayButton() {
      const video = els["main-video"];
      const playing = hasVideoSource(video) ? !video.paused && !video.ended : viewer3d.playing;
      els["interactive-3d-play"].textContent = playing ? "Pause" : "Play";
    }

    function animateInteractive3D() {
      viewer3d.frame = requestAnimationFrame(animateInteractive3D);
      const delta = viewer3d.clock?.getDelta?.() || 0;
      const synced = syncInteractive3DToVideo({ render: false });
      if (!synced && viewer3d.mixer && viewer3d.playing && els["interactive-3d-viewer"].style.display !== "none") {
        const speed = playbackSpeed();
        viewer3d.mixer.update(delta * speed);
        const t = currentAnimationTime();
        els["interactive-3d-scrub"].value = String(Math.round(t * 1000));
        els["interactive-3d-readout"].textContent = `${t.toFixed(2)}s`;
      }
      viewer3d.controls?.update();
      viewer3d.renderer?.render(viewer3d.scene, viewer3d.camera);
    }

    function wrapTime(value, duration) {
      if (!duration) return value;
      return ((value % duration) + duration) % duration;
    }

    function currentAnimationTime() {
      if (!viewer3d.mixer || !viewer3d.duration) return 0;
      return wrapTime(viewer3d.mixer.time, viewer3d.duration);
    }

    function sequenceKey(hand, objId, episode, sep = "/") {
      return [hand, objId, episode].join(sep);
    }

    function shellQuote(value) {
      return `'${String(value).replace(/'/g, "'\\''")}'`;
    }

    function episodeDownloadCommand(ep, mode = state.downloadMode) {
      if (!ep) return "";
      const scriptUrl = new URL("static/download_episode.py", location.href).href;
      const args = [
        "--hand", shellQuote(ep.hand),
        "--object", shellQuote(ep.objId),
        "--episode", shellQuote(ep.episode)
      ];
      if (mode === "full") args.push("--full");
      return `curl -fsSL ${scriptUrl} | python3 - ${args.join(" ")}`;
    }

    function updateDownloadCommand(ep) {
      const menu = els["download-menu"];
      const trigger = els["download-trigger"];
      const input = els["download-command"];
      const button = els["copy-download-command"];
      const description = els["download-description"];
      if (!menu || !trigger || !input || !button || !description) return;
      const command = episodeDownloadCommand(ep);
      input.value = command;
      menu.setAttribute("aria-disabled", ep ? "false" : "true");
      trigger.disabled = !ep;
      input.title = ep ? command : "No sequence selected";
      button.disabled = !ep;
      description.textContent = state.downloadMode === "without-video"
        ? "All files for this episode, without RGB videos"
        : "All files for this episode";
      ["full", "without-video"].forEach(mode => {
        const tab = els[`download-tab-${mode === "full" ? "full" : "without-video"}`];
        tab.setAttribute("aria-pressed", String(mode === state.downloadMode));
      });
      button.textContent = "Copy";
      if (!ep) setDownloadMenuOpen(false);
    }

    function toggleDownloadMenu() {
      if (!currentEpisode()) return;
      setVersionMenuOpen(false);
      setDownloadMenuOpen(!state.downloadMenuOpen);
    }

    function setDownloadMenuOpen(isOpen) {
      state.downloadMenuOpen = isOpen;
      els["download-menu"].classList.toggle("is-open", isOpen);
      els["download-trigger"].setAttribute("aria-expanded", String(isOpen));
      els["download-popover"].hidden = !isOpen;
    }

    function toggleVersionMenu() {
      setDownloadMenuOpen(false);
      setVersionMenuOpen(!state.versionMenuOpen);
    }

    function setVersionMenuOpen(isOpen) {
      state.versionMenuOpen = isOpen;
      els["version-menu"].classList.toggle("is-open", isOpen);
      els["version-trigger"].setAttribute("aria-expanded", String(isOpen));
      els["version-popover"].hidden = !isOpen;
    }

    async function copyDownloadCommand() {
      const input = els["download-command"];
      const button = els["copy-download-command"];
      if (!input?.value) return;
      try {
        await navigator.clipboard.writeText(input.value);
        button.textContent = "Copied";
      } catch (error) {
        input.select();
        document.execCommand?.("copy");
        button.textContent = "Copied";
      }
      window.setTimeout(() => {
        if (button) button.textContent = "Copy";
      }, 1200);
    }

    function glbUrl(ep) {
      const path = [ep.hand, ep.objId, `${ep.episode}.glb`]
        .map(part => encodeURIComponent(part))
        .join("/");
      return `${GLB_BASE}/${path}`;
    }

    function modelUrl(ep) {
      return glbUrl(ep);
    }

    function previewVideoUrl(ep, camera = PREVIEW_CAMERA_ID) {
      const path = [ep.hand, ep.objId, ep.episode, "vid", `${camera}.mp4`]
        .map(part => encodeURIComponent(part))
        .join("/");
      return `${PREVIEW_VIDEO_BASE}/${path}`;
    }

    function videoUrl(ep, camera = PREVIEW_CAMERA_ID) {
      return previewVideoUrl(ep, camera);
    }

    function previewThumbnailUrl(ep, camera = PREVIEW_CAMERA_ID) {
      const time = episodeThumbnailInitialTime(ep);
      return `${previewVideoUrl(ep, camera)}#t=${time.toFixed(3)}`;
    }

    function episodeThumbnailEntry(ep) {
      return ep ? state.episodeThumbnails?.[ep.pathKey] || null : null;
    }

    function episodeThumbnailInitialTime(ep) {
      const entry = episodeThumbnailEntry(ep);
      if (typeof entry === "number") {
        return Number.isFinite(entry) && entry > 0 ? entry : 0.001;
      }
      const time = Number(entry?.videoTime ?? entry?.sourceTime ?? entry?.time);
      return Number.isFinite(time) && time > 0 ? time : 0.001;
    }

    function episodeThumbnailVideoTime(ep, video) {
      const entry = episodeThumbnailEntry(ep);
      if (typeof entry === "number") {
        return Number.isFinite(entry) && entry > 0 ? entry : 0.001;
      }
      const glbTime = Number(entry?.time);
      const glbDuration = Number(entry?.animationDuration ?? entry?.duration);
      const videoDuration = Number(video?.duration);
      if (Number.isFinite(glbTime) && Number.isFinite(glbDuration) && glbDuration > 0 &&
          Number.isFinite(videoDuration) && videoDuration > 0) {
        const ratio = Math.max(0, Math.min(1, glbTime / glbDuration));
        return Math.max(0, Math.min(ratio * videoDuration, Math.max(0, videoDuration - 0.001)));
      }

      const direct = Number(entry?.videoTime ?? entry?.sourceTime);
      if (Number.isFinite(direct) && direct > 0) return direct;
      return episodeThumbnailInitialTime(ep);
    }

    function seekPoseThumbnailVideo(ep, video) {
      if (!ep || !video) return;
      const target = episodeThumbnailVideoTime(ep, video);
      if (!Number.isFinite(target) || target <= 0) return;
      try {
        if (Math.abs((video.currentTime || 0) - target) > 0.05) video.currentTime = target;
      } catch (error) {
        console.warn(error);
      }
    }

    function bindPoseThumbnailTimes() {
      els["pose-strip"].querySelectorAll(".pose-tile").forEach(btn => {
        const item = state.episodes.find(ep => ep.key === btn.dataset.key);
        const video = btn.querySelector("video");
        if (!item || !video) return;
        const apply = () => seekPoseThumbnailVideo(item, video);
        if ((video.readyState || 0) >= 1) apply();
        else video.addEventListener("loadedmetadata", apply, { once: true });
      });
    }

    function objectThumbUrl(objectId, base = THUMB_BASE) {
      return `${base}/${encodeURIComponent(objectId)}/thumb.png?v=${THUMB_VERSION}`;
    }

    function bindObjectThumbnailFallbacks() {
      els["object-strip"].querySelectorAll("img[data-fallback-src]").forEach(img => {
        img.addEventListener("error", () => {
          const fallbackSrc = img.dataset.fallbackSrc;
          if (fallbackSrc) {
            img.dataset.fallbackSrc = "";
            img.src = fallbackSrc;
            return;
          }
          const fallback = document.createElement("div");
          fallback.className = "object-preview";
          fallback.textContent = "No thumbnail";
          img.replaceWith(fallback);
        });
      });
    }

    function graspResultFor(hand, objId, episode) {
      return state.graspResults[sequenceKey(hand, objId, episode)] || null;
    }

    function hasHumanEpisode(objId) {
      const sequences = state.catalog.human?.[objId];
      const values = Array.isArray(sequences) ? sequences : Object.keys(sequences || {});
      return values.length > 0;
    }

    function poseLabel(hand, objId, episode) {
      const result = graspResultFor(hand, objId, episode);
      const displayEpisode = robotEmbodiments.has(hand) && result?.humanPairedEpisode != null
        ? result.humanPairedEpisode
        : episode;
      return `${shortLabels[hand] || labelForHand(hand)} #${String(displayEpisode).padStart(2, "0")}`;
    }

    function graspTitleLabel(ep) {
      const numericEpisode = Number(ep.episode);
      const displayIndex = Number.isFinite(numericEpisode) ? numericEpisode + 1 : ep.episode;
      return `Grasp #${displayIndex}`;
    }

    function outcomeFor(hand, result) {
      if (hand === "human") return "success";
      if (!result || typeof result.graspSuccess !== "boolean") return "unknown";
      return result.graspSuccess ? "success" : "fail";
    }

    function outcomeLabel(value) {
      if (value === "success") return "Success";
      if (value === "fail") return "Fail";
      return "Unknown";
    }

    function labelForHand(value) {
      return labels[value] || titleize(value);
    }

    function orderedEmbodiments(keys) {
      return [...keys].sort((a, b) => embodimentRank(a) - embodimentRank(b) || a.localeCompare(b));
    }

    function embodimentRank(value) {
      const index = embodimentOrder.indexOf(value);
      return index === -1 ? 99 : index;
    }

    function writeStateUrl() {
      const ep = currentEpisode();
      if (!ep || !history.replaceState) return;
      const params = new URLSearchParams();
      params.set("object", ep.objId);
      params.set("embodiment", ep.hand);
      params.set("episode", ep.episode);
      params.set("view", state.currentViewCamera || PREVIEW_CAMERA_ID);
      history.replaceState(null, "", `#${params.toString()}`);
    }

    function titleize(value) {
      return String(value || "")
        .replace(/_/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
  </script>
</body>
