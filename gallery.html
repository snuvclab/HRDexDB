<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRDexDB Sequence Viewer</title>
  <link rel="icon" type="image/png" href="static/image/hrdexdb_logo_square.png">
  <link rel="apple-touch-icon" href="static/image/hrdexdb_logo_square.png">
  <link rel="preconnect" href="https://huggingface.co" crossorigin>
  <link rel="preconnect" href="https://cdn-lfs.huggingface.co" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="dns-prefetch" href="//huggingface.co">
  <link rel="dns-prefetch" href="//cdn-lfs.huggingface.co">
  <link rel="dns-prefetch" href="//unpkg.com">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #faf8f5;
      --surface: #ffffff;
      --surface-2: #f1ece5;
      --line: #ece7e0;
      --line-strong: #d9d0c5;
      --text: #2b2722;
      --text-muted: #8a8178;
      --accent: #e2603b;
      --accent-hover: #c94f30;
      --accent-soft: #fdeee9;
      --green: #6fae58;
      --red: #d9584a;
      --blue: #4f7fb8;
      --radius: 8px;
      --shadow-soft: 0 1px 2px rgba(40, 30, 20, 0.04);
      --shadow-lift: 0 14px 30px rgba(40, 30, 20, 0.10);
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); }
    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 24px;
      min-height: 53px;
      padding: 12px 24px;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .nav-logo {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .nav-logo img {
      display: block;
      width: auto;
      height: 30px;
      max-width: min(42vw, 184px);
      object-fit: contain;
    }

    .nav-links {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      margin-left: auto;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 8px 13px;
      border-radius: 999px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text);
      background: var(--surface-2);
    }

    .nav-link.cta {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 1px 2px rgba(226, 96, 59, 0.25);
    }

    .nav-link.cta:hover,
    .nav-link.cta.active {
      background: var(--accent-hover);
      color: #ffffff;
    }

    .container {
      max-width: 1500px;
      margin: 0 auto;
      padding: 18px 24px 72px;
    }

    .gallery-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 18px;
      margin-bottom: 14px;
    }

    .gallery-kicker {
      color: var(--accent-hover);
      font-size: .78em;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .gallery-title {
      font-size: clamp(2rem, 4vw, 4rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .gallery-title-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-top: 4px;
    }

    .gallery-version {
      color: var(--text-muted);
      font-size: 1.72em;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    .summary-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 9px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: .78em;
      font-weight: 750;
      white-space: nowrap;
    }

    .chip.accent { background: var(--accent-soft); color: var(--accent-hover); }
    .chip.ok { background: #edf6e9; color: #3d7934; }
    .chip.warn { background: #fbe9e7; color: #b34035; }
    .chip.info { background: #eaf1f8; color: #3c6c9f; }

    .explorer-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .control-deck,
    .viewer-main {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
    }

    .control-deck {
      display: grid;
      grid-template-columns: minmax(160px, .8fr) minmax(180px, .9fr);
      gap: 14px;
      padding: 12px 14px;
      align-items: start;
      margin-bottom: 12px;
    }

    .field > label {
      display: block;
      margin-bottom: 4px;
      color: var(--text-muted);
      font-size: .72em;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .check-group {
      display: flex;
      min-height: 38px;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .check-chip {
      display: inline-flex;
      min-height: 26px;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      font-size: .76em;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      user-select: none;
    }

    .check-chip:has(input:checked) {
      border-color: rgba(226, 96, 59, .48);
      background: rgba(226, 96, 59, .12);
      color: var(--text);
    }

    .check-chip:focus-within { border-color: var(--accent); }

    .check-chip input {
      width: 13px;
      height: 13px;
      margin: 0;
      accent-color: var(--accent);
    }

    .empty-check {
      padding: 0 5px;
      color: var(--text-muted);
      font-size: .76em;
      font-weight: 800;
    }

    .viewer-main { overflow: hidden; }

    .viewer-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .selected-title {
      flex: 1 1 auto;
      min-width: 0;
    }

    .selected-title h2 {
      font-size: 1.08em;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .selected-title .sub {
      margin-top: 2px;
      color: var(--text-muted);
      font-size: .82em;
    }

    .viewer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .download-menu,
    .version-menu {
      position: relative;
      flex: 0 0 auto;
    }

    .download-trigger {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
      font-size: .82em;
      font-weight: 850;
      line-height: 1;
      transition: background .16s, border-color .16s, opacity .16s;
    }

    .download-trigger:hover:not(:disabled),
    .download-menu.is-open .download-trigger {
      border-color: var(--accent-hover);
      background: var(--accent-hover);
    }

    .download-trigger:disabled {
      cursor: default;
      opacity: .48;
    }

    .download-trigger-mark {
      font-size: 1em;
    }

    .download-popover {
      position: absolute;
      z-index: 30;
      top: calc(100% + 8px);
      right: 0;
      width: min(560px, calc(100vw - 40px));
      padding: 12px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-lift);
    }

    .download-tabs {
      display: inline-flex;
      margin-bottom: 10px;
      padding: 3px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--surface-2);
    }

    .download-tab {
      min-height: 28px;
      padding: 0 11px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--text-muted);
      font-size: .78em;
      font-weight: 850;
      transition: background .16s, color .16s, box-shadow .16s;
    }

    .download-tab[aria-pressed="true"] {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-soft);
    }

    .download-command {
      display: flex;
      min-height: 36px;
      align-items: center;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      overflow: hidden;
      background: var(--surface-2);
    }

    .download-command input {
      flex: 1 1 auto;
      min-width: 0;
      height: 36px;
      padding: 0 10px;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: .74em;
      font-weight: 750;
    }

    .copy-download-command {
      flex: 0 0 auto;
      height: 36px;
      padding: 0 11px;
      border: 0;
      border-left: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--accent-hover);
      font-size: .8em;
      font-weight: 850;
      white-space: nowrap;
      transition: background .16s, color .16s;
    }

    .copy-download-command:hover {
      background: var(--accent-soft);
      color: var(--accent-hover);
    }

    .copy-download-command:disabled {
      cursor: default;
      opacity: .48;
    }

    .download-description {
      margin-top: 7px;
      color: var(--text-muted);
      font-size: .75em;
      font-weight: 800;
    }

    .version-trigger {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font-size: .82em;
      font-weight: 850;
      line-height: 1;
      transition: border-color .16s, background .16s;
    }

    .version-trigger:hover,
    .version-menu.is-open .version-trigger {
      border-color: rgba(226, 96, 59, .5);
      background: var(--accent-soft);
    }

    .version-trigger-mark {
      color: var(--text-muted);
      font-size: 1em;
    }

    .version-popover {
      position: absolute;
      z-index: 30;
      top: calc(100% + 8px);
      right: 0;
      width: min(300px, calc(100vw - 40px));
      padding: 14px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow-lift);
    }

    .version-popover h3 {
      font-size: .84em;
      line-height: 1.25;
    }

    .version-entry {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .version-number {
      flex: 0 0 auto;
      color: var(--accent-hover);
      font-size: .8em;
      font-weight: 850;
    }

    .version-summary {
      color: var(--text-muted);
      font-size: .78em;
      font-weight: 700;
    }

    .screen-wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      width: 100%;
      aspect-ratio: 8 / 3;
      padding: 10px;
      background: #171613;
    }

    .media-panel {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid rgba(216, 221, 210, .34);
      border-radius: var(--radius);
      background: #080808;
    }

    .media-panel-label {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 4;
      padding: 5px 8px;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 6px;
      background: rgba(12, 12, 12, .58);
      color: rgba(255, 255, 255, .86);
      font-size: .72em;
      font-weight: 850;
      letter-spacing: .04em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
    }

    .camera-view-menu {
      position: absolute;
      z-index: 4;
      top: 10px;
      right: 10px;
      max-width: calc(100% - 136px);
    }

    .camera-view-menu[hidden] { display: none; }

    .camera-view-menu::after {
      content: "";
      position: absolute;
      pointer-events: none;
      top: 50%;
      right: 10px;
      width: 6px;
      height: 6px;
      border-right: 2px solid rgba(255, 255, 255, .82);
      border-bottom: 2px solid rgba(255, 255, 255, .82);
      transform: translateY(-65%) rotate(45deg);
    }

    .camera-view-select {
      display: block;
      width: fit-content;
      max-width: 100%;
      min-height: 30px;
      padding: 0 24px 0 9px;
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 6px;
      background: rgba(12, 12, 12, .58);
      color: rgba(255, 255, 255, .92);
      font-size: .74em;
      font-weight: 850;
      line-height: 1;
      appearance: none;
      backdrop-filter: blur(8px);
    }

    .camera-view-select:disabled { opacity: .5; }

    .screen-wrap video,
    .interactive-3d-viewer,
    .screen-placeholder {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .screen-wrap video {
      display: block;
      object-fit: contain;
      background: #080808;
    }

    .interactive-3d-viewer {
      display: none;
      background: #f7f8f4;
      overflow: hidden;
    }

    .interactive-3d-canvas {
      position: absolute;
      inset: 0;
    }

    .interactive-3d-canvas canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .interactive-3d-status {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 3;
      max-width: min(460px, calc(100% - 24px));
      padding: 8px 10px;
      border: 1px solid rgba(216, 221, 210, .88);
      border-radius: 6px;
      background: rgba(255, 255, 255, .82);
      color: var(--text-muted);
      font-size: .78em;
      font-weight: 800;
      backdrop-filter: blur(8px);
    }

    .interactive-3d-controls {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 3;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border: 1px solid rgba(216, 221, 210, .9);
      border-radius: 7px;
      background: rgba(255, 255, 255, .86);
      backdrop-filter: blur(8px);
    }

    .interactive-3d-controls button,
    .interactive-3d-controls select {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font-size: .78em;
      font-weight: 850;
    }

    .interactive-3d-controls button {
      min-width: 70px;
      padding: 0 10px;
    }

    .interactive-3d-controls select { padding: 4px 8px; }

    .interactive-3d-controls input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .interactive-3d-readout {
      min-width: 86px;
      color: var(--text-muted);
      font-size: .76em;
      font-weight: 850;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .screen-placeholder {
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background:
        linear-gradient(135deg, rgba(226, 96, 59, .16), rgba(20, 20, 20, .2)),
        #111;
      color: rgba(255, 255, 255, .82);
      text-align: center;
    }

    .screen-placeholder.visible { display: flex; }

    .placeholder-box {
      width: min(460px, 100%);
    }

    .placeholder-box h3 {
      margin-bottom: 8px;
      color: #fff;
      font-size: 1.02em;
    }

    .placeholder-box p {
      color: rgba(255, 255, 255, .72);
      font-size: .9em;
      line-height: 1.45;
    }

    .playback-rail {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 54px;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      color: rgba(255, 255, 255, .54);
      font-size: .72em;
    }

    .playback-rail input { width: 100%; accent-color: rgba(255, 255, 255, .7); }

    .selector-stack {
      display: grid;
      gap: 1px;
      border-top: 1px solid var(--line);
      background: var(--line);
    }

    .selector-row {
      display: grid;
      grid-template-rows: auto 0fr;
      background: var(--surface);
      transition: grid-template-rows .22s ease;
    }

    .selector-row.open { grid-template-rows: auto 1fr; }

    .selector-row-header {
      display: grid;
      grid-template-columns: 86px minmax(0, 1fr) auto 24px;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 38px;
      padding: 10px 14px;
      border: 0;
      background: var(--surface);
      color: var(--text);
      text-align: left;
    }

    .selector-row-header:hover { background: #fcfaf7; }

    .selector-row-label {
      color: var(--text);
      font-size: .8em;
      font-weight: 850;
      letter-spacing: .03em;
      text-transform: uppercase;
    }

    .selector-row-value {
      min-width: 0;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: .82em;
      font-weight: 750;
    }

    .selector-row-count {
      color: var(--text-muted);
      font-size: .74em;
      font-weight: 800;
      white-space: nowrap;
    }

    .selector-chevron {
      justify-self: end;
      color: var(--text-muted);
      font-size: 1.2em;
      font-weight: 800;
      line-height: 1;
      transform: rotate(90deg);
      transition: transform .16s;
    }

    .selector-row.open .selector-chevron { transform: rotate(-90deg); }

    .selector-rail {
      min-height: 0;
      overflow: hidden;
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(188px, 222px);
      gap: 10px;
      padding: 0 14px;
      scrollbar-width: thin;
      transition: padding .22s ease;
    }

    .selector-row.open .selector-rail {
      min-height: 174px;
      overflow-x: auto;
      padding-top: 2px;
      padding-bottom: 12px;
    }

    .object-tile,
    .pose-tile,
    .view-tile {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      text-align: left;
      box-shadow: var(--shadow-soft);
      transition: border-color .16s, box-shadow .16s, transform .16s;
    }

    .object-tile:hover,
    .pose-tile:hover,
    .view-tile:hover,
    .object-tile.active,
    .pose-tile.active,
    .view-tile.active {
      border-color: rgba(226, 96, 59, .65);
      box-shadow: var(--shadow-lift);
      transform: translateY(-1px);
    }

    .object-tile.active,
    .pose-tile.active,
    .view-tile.active {
      outline: 2px solid rgba(226, 96, 59, .18);
    }

    .object-tile img,
    .object-preview,
    .pose-tile video,
    .view-tile video,
    .view-preview {
      width: 100%;
      aspect-ratio: 16 / 10;
      display: block;
      object-fit: cover;
      background:
        linear-gradient(135deg, rgba(226, 96, 59, .10), rgba(253, 238, 233, .78)),
        var(--surface-2);
    }

    .object-tile img {
      background: var(--bg);
      object-fit: contain;
    }

    .object-preview,
    .view-preview {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text-muted);
      font-size: .82em;
      font-weight: 800;
    }

    .tile-body {
      min-width: 0;
      padding: 9px 10px 10px;
    }

    .tile-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: .9em;
      font-weight: 850;
      line-height: 1.25;
    }

    .pose-title-row {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 6px;
    }

    .pose-title-row .tile-title {
      flex: 1 1 auto;
    }

    .pose-title-row .chip {
      flex: 0 0 auto;
    }

    .tile-sub {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 2px;
      color: var(--text-muted);
      font-size: .78em;
      font-weight: 700;
    }

    const robotEmbodiments = new Set(["allegro_v5", "inspire_f1", "inspire_dftp"]);

    const state = {

      episodes: [],

      currentViewCamera: null,

      datasetCameraExtrinsics: {},
      datasetCameraIntrinsics: {},
      datasetCameraC2R: {},
      datasetCameraLoads: {},
      robotViewAlignments: {},
      robotViewAlignmentLoads: {},
      mediaRequested: false,

    };

    const viewer3d = {
